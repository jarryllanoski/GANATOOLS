name = "sorteos"
main = "worker.js"
compatibility_date = "2026-10-01"

# ADMIN_PIN se configura como secreto: npx wrangler secret put ADMIN_PIN
[vars]
ALLOWED_ORIGIN = "https://sorteos.jarryllanoski.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "sorteos"
database_id = "8a34493d-6223-4393-b2f6-861d09b801dd"

# Fotos en R2 (plan gratis: 10 GB). Las fotos viejas que sigan en D1 se leen igual.
[[r2_buckets]]
binding = "IMG"
bucket_name = "sorteos-img"

# Páginas que publica el Worker (todo lo que esté en public/ es visible).
# Las rutas /api/* y /pub/* van al código de worker.js.
[assets]
directory = "public"
not_found_handling = "none"

# Una vez al día (3:17 a.m. hora Perú) se vacía lo que lleva más de 30 días en la papelera. Gratis.
[triggers]
crons = ["17 8 * * *"]
