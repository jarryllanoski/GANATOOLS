<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Sorteo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Paleta del formulario de pedidos de Total-Tools (clonado); inputs a 16px para que el celular no haga zoom */
:root{--bg:#080810;--bg2:#0f0f1a;--bg3:#13131f;--card:#0f0f1a;--card2:#13131f;--line:#1e1e30;--line2:#2c2c44;--tx:#f0f0f8;--mu:#7c8494;--ac:#4f8ef7;--ac2:#1d4ed8;--ok:#22c55e;--wa:#22c55e;--warn:#eab308;--bad:#f87171;--org:#f97316;--pur:#a78bfa;--r:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac)}
h1,h2,h3,.syne{font-family:'Syne',sans-serif}
[hidden]{display:none!important}
.wrap{max-width:460px;margin:0 auto;padding:0 16px 130px}
.mu{color:var(--mu)} .sm{font-size:12px} .xs{font-size:11px} .c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-ac{color:var(--ac)}
.row{display:flex;align-items:center;gap:7px} .wrapf{flex-wrap:wrap} .sp{flex:1}
.card{background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.card h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
/* header (.hdr) */
.top{display:flex;align-items:center;gap:10px;height:60px;margin:0 -14px 14px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--ok),#1a7f37);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.top b{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid;white-space:nowrap}
.p-ok{color:var(--ok);background:#2ea0431f;border-color:#2ea04366}.p-warn{color:var(--warn);background:#d299221f;border-color:#d2992266}.p-ac{color:var(--ac);background:#1a3a6b;border-color:var(--ac)}.p-bad{color:var(--bad);background:#f781661f;border-color:#f7816666}.p-pur{color:var(--pur);background:#a371f726;border-color:#a371f759}
/* portada */
.hero{padding:0;overflow:hidden}
.hero img{width:100%;max-height:280px;object-fit:cover;display:block;background:var(--bg)}
.hero .b{padding:14px}
.hero h1{font-size:22px;font-weight:800;line-height:1.2;margin:8px 0 6px}
.prem{display:grid;gap:6px;margin:12px 0}
.prem div{display:flex;gap:9px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-size:13px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.count div{text-align:center;padding:10px 0;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.count b{display:block;font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--ac)}
.count span{font-size:10px;color:var(--mu);text-transform:uppercase}
.bar{height:8px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--ac));border-radius:4px;transition:width .6s}
/* campos (.fg/.fl/.fi) */
.fld{display:block;margin:0 0 11px}
.fld>span{display:block;font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.in{width:100%;background:var(--bg2);border:1.5px solid var(--line2);border-radius:12px;padding:14px 16px;font-size:16px;outline:0;-webkit-appearance:none;transition:border-color .15s}
.in::placeholder{color:var(--mu)}
.in:focus{border-color:var(--ac)}
.in[readonly]{border-color:#22c55e66;background:#22c55e0d}
.in.err{border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pre{display:flex}.pre>b{display:flex;align-items:center;padding:0 13px;background:var(--bg3);border:1.5px solid var(--line2);border-right:0;border-radius:12px 0 0 12px;font-weight:600;font-size:14px;color:var(--mu)}.pre .in{border-radius:0 12px 12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:8px;font-weight:700;font-size:13px;border:1.5px solid var(--line);background:var(--bg2);text-decoration:none;color:var(--tx)}
.btn:active{opacity:.75} .btn[disabled]{opacity:.5;pointer-events:none}
.btn.ac{background:linear-gradient(135deg,var(--ac2),var(--ac));border-color:transparent;color:#fff}
.btn.ok{background:linear-gradient(135deg,var(--ok),#1a7f37);border-color:transparent;color:#fff;font-family:'Syne',sans-serif}
.btn.wa{background:#2ea0431f;border-color:#2ea04366;color:var(--ok)}
.btn.full{width:100%;padding:14px;font-size:15px;border-radius:14px} .btn.sm{padding:6px 11px;font-size:11px;border-radius:7px}
/* números */
.tools{display:flex;gap:7px;margin:8px 0}
.tools .in{flex:1;padding:9px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none;scroll-snap-type:x proximity}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 13px;border-radius:20px;font-weight:700;font-size:11px;background:var(--bg2);border:1.5px solid var(--line);color:var(--mu);flex:none;scroll-snap-align:start}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;margin-top:10px}
.nb{padding:11px 0;border-radius:8px;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;text-align:center;background:var(--bg2);border:1.5px solid var(--line);color:var(--tx)}
.nb:active{transform:scale(.92)}
.nb.t{background:var(--bg);border-color:#21262d;color:#484f58;text-decoration:line-through;pointer-events:none}
.nb.t1{background:#d299220f;border-color:#d2992233;color:#d2992299}
.nb.sel{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 0 0 2px rgba(56,139,253,.45)}
.nb.hl{animation:hl 1.2s 2}
@keyframes hl{50%{box-shadow:0 0 0 3px var(--warn)}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.selbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.num{font-family:'Syne',sans-serif;font-weight:800;padding:4px 10px;border-radius:7px;background:#388bfd1f;border:1px solid #388bfd59;color:#79c0ff;font-size:13px}
.num button{margin-left:6px;color:var(--bad);font-weight:700}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.step button{width:46px;height:46px;border-radius:50%;font-size:22px;font-weight:800;background:var(--bg2);border:1px solid var(--line)}
.step button:active{background:var(--ac);border-color:var(--ac);color:#fff}
.step b{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;min-width:64px;text-align:center}
/* pago */
.total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;background:#2ea0431a;border:1px solid #2ea04359;font-weight:600}
.total b{font-family:'Syne',sans-serif;font-size:22px;color:var(--ok)}
.payrow{display:flex;align-items:center;gap:10px;padding:11px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);margin-top:9px}
.payrow .ic{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;color:#fff}
.payrow .v{flex:1;min-width:0}.payrow .v b{display:block;font-family:'Syne',sans-serif;font-size:18px;letter-spacing:.5px}
.qrimg{display:block;max-width:240px;width:100%;margin:12px auto 0;border-radius:11px;background:#fff;padding:8px}
pre.bank{white-space:pre-wrap;font:inherit;font-size:13px;padding:11px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);margin-top:9px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px 14px;border:2px dashed #388bfd4d;border-radius:11px;background:#388bfd14;text-align:center;margin-top:12px;cursor:pointer;color:var(--ac)}
.drop b{font-size:28px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop.has{border-style:solid;border-color:#2ea04366;background:#2ea0431a;color:var(--ok)}
.prev{display:flex;gap:10px;align-items:center;margin-top:10px}
.prev img{width:72px;height:96px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.warnbox{padding:11px 12px;border-radius:10px;background:#d299221a;border:1px solid #d2992259;font-size:12px;margin-top:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--ac)}
.sw{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--warn)}
/* barra fija inferior */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
.sbar .in2{max-width:452px;margin:0 auto;display:flex;align-items:center;gap:10px}
.sbar b{font-family:'Syne',sans-serif;font-size:16px;display:block;line-height:1.15}
.sbar .btn{flex:none;padding:12px 18px;font-size:14px;border-radius:10px}
/* boleto */
.tk-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line);font-size:13px}
.win{padding:14px;border-radius:11px;background:#2ea0431a;border:1px solid #2ea04366;text-align:center;font-weight:700;font-size:15px;color:var(--ok)}
.win b{font-family:'Syne',sans-serif;font-size:22px;display:block;color:var(--tx)}
.acts{display:grid;gap:9px;margin:12px 0}
/* participantes */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats3 div{text-align:center;padding:12px 4px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.stats3 b{display:block;font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.stats3 span{font-size:10px;color:var(--mu)}
.pl{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#388bfd1f;border:1px solid #388bfd33;color:var(--ac);flex:none}
.pl .i{flex:1;min-width:0;font-size:13px}.pl .i b{display:block;font-weight:600}
.pl .ns{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pl .ns span{font-family:'Syne',sans-serif;font-weight:800;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.res{display:flex;align-items:center;gap:10px;padding:11px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);margin-top:8px}
.res .n{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--ok);min-width:56px;text-align:center}
.res.sup .n{color:var(--mu)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;color:var(--mu);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0 10px}
.vok{color:var(--ok);font-weight:700}.vko{color:var(--bad);font-weight:700}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
/* varios */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);opacity:0;background:var(--bg3);border:1px solid var(--ok);color:var(--tx);padding:9px 18px;border-radius:20px;font-size:12px;font-weight:500;z-index:999;transition:opacity .3s;max-width:92vw;text-align:center;pointer-events:none}
.toast.on{opacity:1}.toast.bad{border-color:var(--bad)}.toast.ok{border-color:var(--ok)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:400;display:flex;align-items:flex-end;justify-content:center}
.mod .box{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:up .2s ease}
.mod .box::before{content:'';display:block;width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mod .x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);color:var(--mu)}
.mod pre{white-space:pre-wrap;font:inherit;font-size:13px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:20px}
.center b.e{font-size:52px;display:block;margin-bottom:10px}
.spin{width:18px;height:18px;border:2.5px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.big{width:34px;height:34px;border-color:#388bfd44;border-top-color:var(--ac)}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{padding:12px;border-radius:10px;text-align:center;font-weight:700;margin:0 0 12px;font-size:13px}
.mine{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:10px;background:#a371f71f;border:1px solid #a371f759;margin-top:12px;font-size:13px}
.powered{text-align:center;padding:18px;font-size:10px;color:var(--line);letter-spacing:1px}
/* ───── Formulario por pasos (clon de Total-Tools) ───── */
.hdr{display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.hdr b{font-weight:800;font-size:13px;letter-spacing:.8px;color:var(--mu);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ayuda{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:9px;background:#a78bfa1f;border:1px solid #a78bfa66;color:var(--pur);font-weight:700;font-size:13px;text-decoration:none}
.hero-foto{position:relative;margin:0 0 12px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);cursor:zoom-in}
.hero-foto img{display:block;width:100%;max-height:360px;object-fit:cover}
.hero-foto .tag{position:absolute;left:12px;top:12px;padding:5px 11px;border-radius:20px;background:rgba(8,8,16,.78);backdrop-filter:blur(4px);font-weight:800;font-size:12px;letter-spacing:.5px}
.hero-foto .zoom{position:absolute;right:10px;bottom:10px;padding:4px 9px;border-radius:8px;background:rgba(8,8,16,.7);font-size:11px;color:#fff}
.pie{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;text-align:center;font-size:12px;color:var(--mu);line-height:1.9}
.pie a{color:#22d3ee;text-decoration:none;font-weight:700}
/* DNI y RENIEC (copiado de Total-Tools) */
#fDni.dni-escanea{background-image:linear-gradient(90deg,transparent,rgba(79,142,247,.28),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:dniEscanea 1s linear infinite}
@keyframes dniEscanea{from{background-position:-60% 0}to{background-position:160% 0}}
.dni-msg{margin:-4px 0 12px;min-height:2px}
.dni-buscando{font-size:12.5px;color:var(--ac);font-weight:700}
.dni-puntos::after{content:'';animation:dniPuntos 1.2s steps(4) infinite}
@keyframes dniPuntos{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.dni-nada{font-size:12.5px;color:var(--mu)}
.dni-ok{color:var(--ok);font-weight:800;font-size:12.5px}
.dni-sug{background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.35);border-radius:12px;padding:12px;animation:slideIn .3s ease}
.dni-sug-t{font-size:12.5px;color:var(--mu);font-weight:700}
.dni-sug-n{font-size:16px;font-weight:900;margin:4px 0 10px;letter-spacing:.02em}
.dni-sug-si{width:100%;min-height:44px;border:none;border-radius:10px;background:var(--ok);color:#04120a;font-weight:800;font-size:14px}
.dni-link{background:none;border:none;color:var(--mu);text-decoration:underline;font-size:12px;padding:8px 0 0;display:block;margin:0 auto}
.dni-ok .dni-link{display:inline;padding:0 0 0 6px;color:var(--ac)}
/* Agencias Shalom (copiado de Total-Tools) */
.agc-box{padding:14px;background:var(--bg3);border:1px solid var(--line);border-radius:14px}
.agc-lbl{font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px;display:block}
.ag-ubic{background:rgba(79,142,247,.08);border:1.5px solid rgba(79,142,247,.35);border-radius:14px;padding:12px;margin:2px 0 12px}
.ag-ubic-btn{width:100%;min-height:52px;border:none;border-radius:12px;background:var(--ac);color:#fff;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.ag-ubic-btn:disabled{opacity:.8}
.ag-ubic-sub{font-size:11.5px;color:var(--mu);line-height:1.45;margin-top:8px;text-align:center}
.ag-ubic.ag-error{background:rgba(234,179,8,.08);border-color:rgba(234,179,8,.35)}
#agLupaHint{font-size:12px;font-weight:700;color:var(--mu);margin:0 0 6px}
#agLupaHint.on{color:var(--ac)}
.ag-buscar{position:relative;margin-bottom:8px}
.ag-buscar .in{padding-left:42px}
.ag-lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.75;pointer-events:none;animation:agLupa 1.8s ease-in-out infinite}
.ag-buscar.quieto .ag-lupa{animation:none;opacity:.6}
@keyframes agLupa{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.22)}}
.ag-foco .in{border-color:var(--ac);animation:agFoco 1s ease-in-out 2}
@keyframes agFoco{0%,100%{box-shadow:0 0 0 0 rgba(91,155,255,0)}50%{box-shadow:0 0 0 6px rgba(91,155,255,.35)}}
.ag-lista{background:var(--bg2);border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;max-height:330px;overflow-y:auto}
.ag-lista-cab{padding:8px 12px;background:rgba(79,142,247,.10);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ac)}
.ag-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.ag-item:last-child{border-bottom:none}.ag-item:active{background:#4f8ef71a}
.ag-item-ic{font-size:16px;line-height:1.2;flex-shrink:0}
.ag-item-t{font-weight:800;font-size:13.5px}
.ag-item-d{font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.4}
.ag-item-p{font-size:11px;color:var(--mu);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.ag-item-km{color:var(--ac);font-weight:700}
.ag-sel{background:rgba(34,197,94,.08);box-shadow:inset 0 0 0 2px var(--ok);border-radius:12px;padding:12px;display:flex;gap:10px}
.ag-sel .ag-item-ic{color:var(--ok)}
.ag-cambiar{display:block;width:100%;background:none;border:none;border-top:1px solid var(--line);color:var(--ac);font-weight:800;font-size:13px;padding:11px 0 2px;margin-top:10px}
.ag-vacio{padding:16px;text-align:center;color:var(--mu);font-size:13px}
/* ───── Botones principales ───── */
.btn-main{width:100%;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;padding:16px;transition:opacity .15s,transform .1s}

.pack-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);padding:3px 9px;border-radius:20px;background:linear-gradient(135deg,#f97316,#eab308);color:#1a1000;font-style:normal;font-size:9.5px;font-weight:900;letter-spacing:.8px;white-space:nowrap}

/* ───── Revelado de números (tragamonedas) ───── */
.revela{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 40%,#16204a,#05050c 70%);overflow:hidden;animation:subir .3s ease}

.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:caer linear forwards;pointer-events:none}
@keyframes caer{to{top:105%;transform:translateX(40px) rotate(720deg)}}
/* ───── Ticket del cliente: diseño del ticket impreso (talón TOTAL) ───── */
.tks{display:grid;gap:10px;margin:0 0 12px}
.tkc{position:relative;display:flex;min-height:118px;border-radius:14px;overflow:hidden;color:#fff;background:linear-gradient(115deg,#075b61,#0b858b 55%,#14aaae);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.tkc-serie{flex:none;width:26px;display:flex;align-items:center;justify-content:center;background:#05484d}
.tkc-serie span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:800;letter-spacing:1px;white-space:nowrap}
.tkc-cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:11px 12px}
.tkc-cab{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tkc-marca{padding:2px 9px;background:#e30613;transform:skewX(-14deg);box-shadow:0 0 0 2px #fff;font-style:italic;font-weight:900;font-size:12px;white-space:nowrap}
.tkc-pos{padding:1px 8px;border:1.5px solid #fff;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.tkc-titulo{font-size:14.5px;line-height:1.2;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tkc-corte{position:relative;flex:none;width:0;border-left:2.5px dashed #fff}

.tkc-talon{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(-50deg,#e30613 0 14px,#c3040f 14px 28px)}

.tkc-talon b{font-size:32px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.tk-det{padding:4px 16px}
/* Tarjetas de courier (#courierCards de Total-Tools): 3 por fila */
.cour-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 12px}
.cour-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;background:var(--bg3);border:2px solid #4a4a5e;border-radius:14px;padding:14px 6px;min-height:96px;color:var(--tx);transition:border-color .15s,background .15s}
.cour-card .ic{font-size:26px;line-height:1}

.cour-card::after{content:'';position:absolute;right:7px;top:7px;width:15px;height:15px;border-radius:50%;border:2px solid #6a6a80}

.cour-card.on::after{background:var(--ac);border-color:var(--ac);box-shadow:inset 0 0 0 3px var(--bg3)}
.env-res{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:rgba(34,197,94,.08);box-shadow:inset 0 0 0 2px var(--ok)}
.env-res .ic{font-size:22px}.env-res b{display:block;font-size:14px}.env-res span{font-size:12px;color:var(--mu)}
#secEnv textarea.in{resize:vertical;line-height:1.4}
/* Heavy, el guía (clon del narrador de Total-Tools) */
.hv{position:fixed;left:10px;bottom:calc(12px + var(--alto-barra, 0px));z-index:60;display:flex;align-items:flex-end;gap:8px;max-width:440px;pointer-events:none}
.hv-av{position:relative;width:62px;height:62px;flex:none;pointer-events:auto;animation:hvIn .4s ease}
.hv-av img{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.hv-av span{position:absolute;left:-2px;bottom:-4px;background:var(--ac);color:#fff;font-size:8.5px;font-weight:900;letter-spacing:.6px;padding:1px 5px;border-radius:5px}
.hv-b{position:relative;pointer-events:auto;background:#101a2e;border:1px solid #2b4c86;border-radius:14px;padding:10px 30px 11px 12px;margin-bottom:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:hvIn .3s ease}
.hv-b::before{content:'';position:absolute;left:-7px;bottom:14px;border:7px solid transparent;border-right-color:#2b4c86;border-left:0}
.hv-n{font-size:10px;font-weight:900;letter-spacing:1.2px;color:var(--ac);margin-bottom:3px}
.hv-t{font-size:14px;line-height:1.35}
.hv-x{position:absolute;right:8px;top:6px;color:var(--mu);font-size:15px}
@keyframes hvIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.wstep,.hv-av,.hv-b,.dni-sug,.ag-lupa,#fDni.dni-escanea,.dni-puntos::after{animation:none!important}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
</style>

<body>
<div class="wrap" id="app"><div class="center"><span class="spin big"></span></div></div>
<div class="sbar" id="sbar" hidden><div class="in2"><div class="sp"><b id="sbN">Elige tus tickets</b><span class="sbar-t" id="sbT"></span></div><button class="btn ac" id="sbGo">Elegir</button></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONFIG — edita aquí
   ===================================================================== */
const CONFIG = {
  API: 'https://sorteos.jarryllanoski.workers.dev', // URL de tu Worker, ej: https://sorteos.tuusuario.workers.dev
  NEGOCIO: 'TOTAL TOOLS',
  MIN_PARTICIPANTES_VISIBLES: 100,  // la lista de participantes se muestra desde esta cantidad
};

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem('sxf_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('sxf_' + k, JSON.stringify(v)); } catch (e) {} };
const fmtS = n => 'S/ ' + (+n || 0).toFixed(2);
const baseOf = c => (c.base === 0 ? 0 : 1);
const digs = c => String((c.cantidad || 1) - 1 + baseOf(c)).length;
const fmtN = (c, i) => String(i + baseOf(c)).padStart(digs(c), '0');
const splitN = s => String(s || '').split(',').filter(x => x !== '').map(Number);
const fechaL = t => t ? new Date(t).toLocaleString('es-PE', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
const fecha = t => t ? new Date(t).toLocaleString('es-PE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const EST = { R: { t: 'Reservado · falta pagar', p: 'p-warn', i: '⏳' }, V: { t: 'Pago en revisión', p: 'p-ac', i: '🔎' }, P: { t: 'Confirmado', p: 'p-ok', i: '✅' }, X: { t: 'Anulado', p: 'p-bad', i: '✖️' } };
const enc = s => new TextEncoder().encode(s);
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const sha = async s => hex(await crypto.subtle.digest('SHA-256', typeof s === 'string' ? enc(s) : s));
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const API_URL = () => CONFIG.API.replace(/\/$/, '');
const pubImg = k => k ? API_URL() + '/pub/' + k : '';
const here = () => location.href.split('?')[0];
const linkBoleto = tok => `${here()}?t=${tok}`;
const linkPart = r => `${here()}?r=${r}&v=p`;
const linkForm = r => `${here()}?r=${r}`;

function mostrarBarra(visible) {
  $('#sbar').hidden = !visible;
  document.documentElement.style.setProperty('--alto-barra', visible ? $('#sbar').offsetHeight + 'px' : '0px');
}
function toast(msg, tipo = '') { const t = $('#toast'); t.textContent = msg; t.className = 'toast on ' + tipo; clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200); }
function modal(html) {
  const m = document.createElement('div'); m.className = 'mod';
  m.innerHTML = `<div class="box"><button class="x" data-x>✕</button>${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) m.remove(); });
  document.body.appendChild(m); return m;
}
async function copiar(t) {
  try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('📋 Copiado');
}
function waURL(num, text) { let n = String(num || '').replace(/\D/g, ''); if (n.length === 9) n = '51' + n; return 'https://wa.me/' + n + '?text=' + encodeURIComponent(text); }
function precioTotal(c, k) {
  const pu = +c.precio || 0, promos = (c.promos || []).filter(p => p.n > 1), best = [0];
  for (let i = 1; i <= k; i++) { let v = best[i - 1] + pu; for (const p of promos) if (i >= p.n) v = Math.min(v, best[i - p.n] + p.p); best[i] = v; }
  return Math.round(best[k] * 100) / 100;
}
async function comprimir(file, max = 1280, q = 0.75) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se pudo leer la imagen')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let b = await new Promise(r => cv.toBlob(r, 'image/webp', q));
    if (!b || b.type !== 'image/webp') b = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    return b;
  } finally { URL.revokeObjectURL(url); }
}
async function api(path, opt = {}) {
  let r;
  try { r = await fetch(API_URL() + path, { method: opt.body ? 'POST' : 'GET', body: opt.body }); }
  catch (e) { throw new Error('Sin conexión. Revisa tu internet e intenta de nuevo.'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('Error del servidor (' + r.status + ')'); }
  if (!r.ok || j.ok === false) { const e = new Error(j.error || 'Error ' + r.status); e.status = r.status; throw e; }
  return j;
}
function cuenta(el, t, fin) {
  const tick = () => {
    const d = t - Date.now(); if (!document.body.contains(el)) return clearInterval(h);
    if (d <= 0) { clearInterval(h); fin && fin(); return; }
    const D = Math.floor(d / 864e5), H = Math.floor(d / 36e5) % 24, M = Math.floor(d / 6e4) % 60, Sg = Math.floor(d / 1e3) % 60;
    el.innerHTML = el.dataset.mode === 'mini' ? `${D ? D + 'd ' : ''}${String(H).padStart(2, '0')}:${String(M).padStart(2, '0')}:${String(Sg).padStart(2, '0')}`
      : [[D, 'días'], [H, 'horas'], [M, 'min'], [Sg, 'seg']].map(([v, l]) => `<div><b>${String(v).padStart(2, '0')}</b><span>${l}</span></div>`).join('');
  };
  const h = setInterval(tick, 1000); tick();
}
const misBoletos = r => lsGet('bol_' + r, []);
function guardarBoleto(r, tok) { const a = misBoletos(r).filter(x => x !== tok); a.unshift(tok); lsSet('bol_' + r, a.slice(0, 20)); }

/* Sorteo verificable — mismo algoritmo que el servidor */
async function drawPicks(seed, snap, beacon, k) {
  const paid = []; for (let i = 0; i < snap.length; i++) if (snap[i] === '1') paid.push(i);
  const eh = await sha(paid.join(','));
  const key = await crypto.subtle.importKey('raw', enc(seed), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const pool = paid.slice(), out = [];
  for (let j = 0; j < k && pool.length; j++) {
    const h = hex(await crypto.subtle.sign('HMAC', key, enc(`${eh}:${beacon}:${j}`)));
    out.push(pool.splice(Number(BigInt('0x' + h.slice(0, 13)) % BigInt(pool.length)), 1)[0]);
  }
  return { picks: out, eh };
}

/* =====================================================================
   ESTADO + ARRANQUE
   ===================================================================== */
const P = new URLSearchParams(location.search);
const S = { r: P.get('r'), t: P.get('t'), v: P.get('v'), l: P.get('l'), cfg: null, board: '', qty: 0, maxTickets: 1, fijos: [], file: null, ih: '', link: null, ts: '' };
const app = $('#app');

function cabecera(c) {
  const neg = c?.negocio || CONFIG.NEGOCIO;
  document.title = c?.titulo ? `${c.titulo} · ${neg}` : neg;
  return `<div class="hdr"><b>🎟️ ${esc(neg.toUpperCase())}</b>${c?.wa ? `<a class="ayuda" href="${waURL(c.wa, 'Hola, tengo una consulta sobre el sorteo ' + (c.titulo || ''))}" target="_blank">💬 Ayuda</a>` : ''}</div>`;
}
const participantesVisibles = () => (S.participantes || 0) >= CONFIG.MIN_PARTICIPANTES_VISIBLES;
function pie(c) {
  return `<div class="pie">🔐 Sorteo verificable${participantesVisibles() ? ` · <a href="${linkPart(S.r)}">ver participantes</a>` : ''}<br>${esc(c?.negocio || CONFIG.NEGOCIO)}${c?.wa ? ` · <a href="${waURL(c.wa, 'Hola')}" target="_blank">WhatsApp</a>` : ''}</div>`;
}
function vError(tit, txt, extra = '') {
  mostrarBarra(false);
  app.innerHTML = `${cabecera(S.cfg)}<div class="center"><div><b class="e">😕</b><h2 class="syne">${esc(tit)}</h2><p class="mu" style="margin:8px 0 18px">${esc(txt)}</p>${extra}</div></div>`;
}
async function boot() {
  if (!CONFIG.API) return vError('Falta configurar', 'Abre formulario.html y pon la URL de tu Worker en CONFIG.API');
  try {
    if (S.t) return await vBoleto(S.t);
    if (S.l) {
      const L = await api('/api/l/' + encodeURIComponent(S.l));
      S.r = L.rifa;
      if (L.usado) return vError('Este link ya fue usado', 'Los links personalizados son de un solo uso. Puedes participar con el link general.', `<a class="btn ac" href="${linkForm(S.r)}">🎟️ Ir al sorteo</a>`);
      S.link = L.data;
    }
    if (!S.r) return vError('Link incompleto', 'Pide al organizador el link correcto del sorteo.');
    if (S.v === 'p') return await vPart();
    return await vForm();
  } catch (e) { vError(e.status === 404 ? 'No encontrado' : 'Algo salió mal', e.message, `<button class="btn" onclick="location.reload()">🔄 Reintentar</button>`); }
}

/* =====================================================================
   VISTA: FORMULARIO
   ===================================================================== */
async function vForm() {
  const j = await api('/api/r/' + encodeURIComponent(S.r));
  S.cfg = j.cfg; S.board = j.board; S.participantes = j.participantes || 0;
  const c = S.cfg, total = S.board.length, libres = (S.board.match(/0/g) || []).length;
  const cierreVenta = c.cierre ? c.cierre - (c.bloqueoH || 0) * 3600e3 : 0;
  const abierta = c.estado === 'activa' && (!cierreVenta || Date.now() < cierreVenta) && libres > 0;
  const mios = misBoletos(S.r);
  let h = cabecera(c) + portadaHTML(c, total, libres, cierreVenta)
    + (mios.length ? `<a class="mine" href="${linkBoleto(mios[0])}">🎟️ <span class="sp">Ya tienes ${mios.length} registro${mios.length === 1 ? '' : 's'} en este sorteo</span><b>Ver ➜</b></a>` : '');

  if (c.resultado) {
    app.innerHTML = h + resultadoHTML(c) + (participantesVisibles() ? `<a class="btn full" href="${linkPart(S.r)}">👥 Ver participantes y verificación</a>` : '') + pie(c);
    mostrarBarra(false); return;
  }
  if (!abierta) {
    const motivo = libres === 0 ? '🎉 ¡Se vendieron todos los tickets!' : c.estado === 'pausada' ? '⏸️ El sorteo está pausado por el momento' : '🔒 La inscripción ya cerró';
    app.innerHTML = h + `<div class="banner card">${motivo}</div>` + (participantesVisibles() ? `<a class="btn full" href="${linkPart(S.r)}">👥 Ver participantes</a>` : '') + pie(c);
    mostrarBarra(false);
    if ($('#cd')) cuenta($('#cd'), cierreVenta || c.cierre);
    return;
  }

  S.fijos = S.link ? numerosDelLink(S.link.nums) : [];
  S.maxTickets = Math.max(1, Math.min(c.maxSel || 20, c.maxPer || Infinity, libres));
  app.innerHTML = h + pasoCantidadHTML(c) + pasoDatosHTML(c) + pasoPagoHTML(c) + pie(c);
  mostrarBarra(true);
  if ($('#cd')) cuenta($('#cd'), cierreVenta || c.cierre, () => location.reload());
  bindSubida();
  if (c.tsKey) cargarTurnstile(c.tsKey);
  restaurarBorrador();
  if (S.fijos.length) elegirCantidad(S.fijos.length, { sinScroll: true });
  actualizarFlujo();
  cargarActividad();
  heavy(mios.length ? '¡Te reconozco! 👊 ¿Más tickets, más oportunidades?' : '¡Hola! 🎟️ Elige cuántos tickets quieres. Tus números salen al azar al final.');
}

/* ───── Paso 1: cuántos tickets (los números salen al azar al final) ───── */
function paquetes(c) {
  const unitario = +c.precio || 0;
  const promociones = (c.promos || []).map(p => p.n);
  const prioridad = [1, ...promociones, 3, 5, 10, S.maxTickets];
  const cantidades = [...new Set(prioridad)].filter(n => n >= 1 && n <= S.maxTickets).slice(0, 4).sort((a, b) => a - b);
  const lista = cantidades.map(n => ({ n, total: precioTotal(c, n), ahorro: Math.round((n * unitario - precioTotal(c, n)) * 100) / 100 }));
  const conAhorro = lista.filter(p => p.ahorro > 0);
  const mejor = conAhorro.sort((a, b) => a.total / a.n - b.total / b.n)[0];
  if (mejor) mejor.mejor = true;
  return lista;
}

/* ───── El momento: revelar los números como una tragamonedas ───── */
function animarRevelado(numeros) {
  const c = S.cfg, ancho = digs(c), visibles = numeros.slice(0, 12), extra = numeros.length - visibles.length;
  const capa = document.createElement('div'); capa.className = 'revela';
  capa.innerHTML = `<div class="rv-caja"><p class="rv-t" id="rvT">Sorteando tus números…</p>
    <div class="rv-nums">${visibles.map(() => `<div class="rv-num">${'<span>0</span>'.repeat(ancho)}</div>`).join('')}</div>
    ${extra > 0 ? `<p class="mu sm">+ ${extra} número${extra === 1 ? '' : 's'} más en tu ticket</p>` : ''}
    <button class="btn-main" id="rvOk" hidden>Ver mi ticket ➜</button></div>`;
  document.body.appendChild(capa);
  const sinMovimiento = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cajas = $$('.rv-num', capa);
  return new Promise(listo => {
    const terminar = () => {
      $('#rvT', capa).textContent = numeros.length === 1 ? '¡Este es tu número!' : '¡Estos son tus números!';
      capa.classList.add('fin'); confeti(capa); $('#rvOk', capa).hidden = false;
      const cerrar = () => { capa.remove(); listo(); };
      $('#rvOk', capa).onclick = cerrar;
      setTimeout(() => capa.isConnected && $('#rvOk', capa).focus(), 100);
    };
    if (sinMovimiento) { cajas.forEach((caja, i) => { caja.innerHTML = [...fmtN(c, visibles[i])].map(d => `<span>${d}</span>`).join(''); caja.classList.add('ok'); }); return terminar(); }
    const giro = setInterval(() => $$('.rv-num:not(.ok) span', capa).forEach(d => { d.textContent = Math.floor(Math.random() * 10); }), 55);
    const paso = Math.min(700, 2400 / visibles.length);
    cajas.forEach((caja, i) => setTimeout(() => {
      caja.innerHTML = [...fmtN(c, visibles[i])].map(d => `<span>${d}</span>`).join(''); caja.classList.add('ok');
      try { navigator.vibrate?.(35); } catch (e) {}
      if (i === cajas.length - 1) { clearInterval(giro); setTimeout(terminar, 350); }
    }, 900 + i * paso));
  });
}
function confeti(capa) {
  const colores = ['#22c55e', '#4f8ef7', '#eab308', '#f87171', '#a78bfa', '#ffffff'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i'); p.className = 'cf';
    p.style.cssText = `left:${Math.random() * 100}%;background:${colores[i % colores.length]};animation-delay:${Math.random() * .4}s;animation-duration:${1.6 + Math.random() * 1.4}s;transform:rotate(${Math.random() * 360}deg)`;
    capa.appendChild(p);
  }
}

/* ───── DNI → nombre oficial (RENIEC, consultado por el Worker con tu clave) ─────
   Si la consulta no está disponible (sin clave, tope del día, sin red), el
   formulario sigue igual: el cliente escribe su nombre a mano. Degrada, no rompe. */
const DNI = { ult: '', persona: null, aceptado: false };
async function dniBuscar(v, silencioso) {
  const box = $('#dniMsg'), inp = $('#fDni');
  if (v.length !== 8) { if (DNI.aceptado) dniSoltar(); box.innerHTML = ''; DNI.ult = ''; return; }
  if (v === DNI.ult) return; DNI.ult = v; DNI.persona = null;
  inp.classList.add('dni-escanea'); box.innerHTML = '<span class="dni-buscando">🪪 Buscando en RENIEC<span class="dni-puntos"></span></span>';
  let j;
  try { const r = await fetch(API_URL() + '/api/dni/' + v); j = await r.json(); } catch (e) { j = { ok: false, motivo: 'ERROR' }; }
  if (inp.value.replace(/\D/g, '') !== v) return;  // lo cambiaron mientras buscaba
  inp.classList.remove('dni-escanea');
  if (j.ok && j.persona) {
    DNI.persona = j.persona;
    const nom = $('#fNom').value.trim().toUpperCase();
    if (silencioso && nom && nom === j.persona.completo) return dniAceptar(true);
    box.innerHTML = `<div class="dni-sug"><div class="dni-sug-t">¿Eres tú?</div><div class="dni-sug-n">${esc(j.persona.completo)}</div><button class="dni-sug-si" id="dniSi">✅ Sí, soy yo</button><button class="dni-link" id="dniNo">No, corregir el DNI</button></div>`;
  } else if (j.motivo === 'NO_EXISTE') box.innerHTML = '<div class="dni-nada">No encontramos ese DNI. Revisa los números o escribe tu nombre abajo.</div>';
  else box.innerHTML = silencioso ? '' : '<div class="dni-nada">Escribe tu nombre completo abajo.</div>';
}
function dniAceptar(silencioso) {
  if (!DNI.persona) return;
  DNI.aceptado = true;
  const n = $('#fNom'); n.value = DNI.persona.completo; n.readOnly = true;
  $('#dniMsg').innerHTML = '<div class="dni-ok">✅ Nombre verificado con RENIEC<button class="dni-link" id="dniNo">No soy yo</button></div>';
  actualizarFlujo();
  if (!silencioso) { heavy('Identidad verificada ✅. Si ganas, el premio solo se le entrega a esta persona.'); $('#fCel').focus(); }
}
function dniSoltar() { DNI.aceptado = false; const n = $('#fNom'); if (n.readOnly) { n.readOnly = false; n.value = ''; } }
function dniCorregir() { dniSoltar(); DNI.persona = null; DNI.ult = ''; $('#fDni').value = ''; $('#dniMsg').innerHTML = ''; actualizarFlujo(); $('#fDni').focus(); }

/* ───── Cómo recibir el premio: los couriers del formulario de Total-Tools ─────
   Se pregunta en el boleto, cuando el cliente ya participa. Es opcional y cada
   courier se prende o apaga por sorteo en el panel (Config → Envío del premio). */
const ENVIOS = [
  { k: 'env_shalom', n: 'SHALOM', t: 'agencia', ic: '🚌', lista: 'data/agencias-shalom.json' },
  { k: 'env_olva', n: 'OLVA COURIER', t: 'agencia', ic: '📦', lista: 'data/agencias-olva.json' },
  { k: 'env_marvisur', n: 'MARVISUR', t: 'agencia', ic: '🚐' },
  { k: 'env_delivery', n: 'DELIVERY', t: 'domicilio', ic: '🛵' },
  { k: 'env_otras', n: 'OTRAS AGENCIAS', t: 'encomienda', ic: '🏢' },
  { k: 'env_retiro', n: 'RETIRO EN TIENDA', t: 'retiro', ic: '🏪' },
];
const enviosDe = c => ENVIOS.filter(e => c[e.k] !== false);
const envDe = p => { try { const a = p.agencia ? (typeof p.agencia === 'string' ? JSON.parse(p.agencia) : p.agencia) : null; if (a && !a.courier) { a.courier = 'SHALOM'; a.tipo = 'agencia'; } return a; } catch (e) { return null; } };
const agDe = envDe;
function envTexto(a, c) {
  if (!a) return '';
  if (a.tipo === 'retiro') return `Retiro en tienda${c?.tiendaDir ? ': ' + c.tiendaDir : ''}`;
  if (a.tipo === 'domicilio') return `Delivery: ${[a.dir, a.dist].filter(Boolean).join(', ')}${a.ref ? ' (' + a.ref + ')' : ''}`;
  if (a.tipo === 'encomienda') return `${a.ciudad}${a.nombre ? ' · ' + a.nombre : ''}`;
  return `${a.nombre}${a.dir ? ' · ' + a.dir : ''}`;
}
const ENV = { e: null, sel: null, boleto: null };  // courier elegido, agencia elegida, contexto del boleto
const AG = { listas: {}, carga: {}, yo: null };
const plano = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const tit = s => String(s || '').toLowerCase().replace(/(^|[\s(\-/.])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
function agTitulo(a, courier) {
  if (courier !== 'SHALOM') return tit(a.nombre);
  const p = String(a.nombre || '').split('/').map(x => x.trim()).filter(Boolean);
  const d = tit(p[2] || a.distrito || ''), r = tit(p.slice(3).join(' / '));
  return 'Shalom ' + d + (r && plano(r) !== plano(d) ? ` (${r})` : '');
}
function agCargar(e = ENV.e) {
  const url = e.lista;
  if (AG.listas[url]) return Promise.resolve(AG.listas[url]);
  return AG.carga[url] ||= fetch(url).then(r => { if (!r.ok) throw new Error('lista'); return r.json(); }).then(j => {
    return AG.listas[url] = (j.agencias || []).map((a, i) => ({ ...a, _id: a.ter_id ? String(a.ter_id) : 'o' + i, _t: plano([a.nombre, a.departamento, a.provincia, a.distrito, a.direccion].join(' ')), _lat: +a.latitud, _lng: +a.longitud }));
  }).catch(er => { delete AG.carga[url]; throw er; });
}
function km(a) {
  if (!AG.yo || !isFinite(a._lat) || !isFinite(a._lng) || !a._lat) return null;
  const R = 6371, rad = x => x * Math.PI / 180, dLa = rad(a._lat - AG.yo.lat), dLo = rad(a._lng - AG.yo.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(AG.yo.lat)) * Math.cos(rad(a._lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function agItem(a) {
  const k = km(a);
  return `<div class="ag-item" data-ag="${esc(a._id)}"><div class="ag-item-ic">📍</div><div><div class="ag-item-t">${esc(agTitulo(a, ENV.e.n))}</div>
    <div class="ag-item-d">${esc(a.direccion)}${a.referencia ? ' · ' + esc(a.referencia) : ''}</div>

  // Recién registrado: si falta el envío, WhatsApp se abre después de elegirlo (o de "Lo elijo después")
  if (nuevo && !(c.pedirAgencia && enviosDe(c).length && !envDe(p))) envSeguir();

const TICKET_IMAGEN = { ancho: 1080, margen: 60, alto: 230, separacion: 26, cabecera: 300, pie: 170 };
function guardarTicketComoImagen(c, p, nums) {
  const T = TICKET_IMAGEN, alto = T.cabecera + nums.length * (T.alto + T.separacion) + T.pie;
  const lienzo = document.createElement('canvas'); lienzo.width = T.ancho; lienzo.height = alto;
  const x = lienzo.getContext('2d'), fuente = (peso, px) => `${peso} ${px}px Arial, Helvetica, sans-serif`;
  x.fillStyle = '#080810'; x.fillRect(0, 0, T.ancho, alto);
  x.textAlign = 'center'; x.fillStyle = '#ffffff'; x.font = fuente(800, 54); wrap(x, c.titulo, T.ancho / 2, 120, T.ancho - 2 * T.margen, 62, 2);
  x.fillStyle = '#9ca3af'; x.font = fuente(700, 34); x.fillText(String(p.nombre).toUpperCase().slice(0, 34), T.ancho / 2, 250);
  nums.forEach((n, i) => dibujarTicket(x, T.margen, T.cabecera + i * (T.alto + T.separacion), T.ancho - 2 * T.margen, T.alto, { c, p, numero: fmtN(c, n), posicion: nums.length > 1 ? `${i + 1} de ${nums.length}` : 'Único', fuente }));
  const e = EST[p.est] || EST.R;
  x.textAlign = 'center'; x.fillStyle = { R: '#eab308', V: '#4f8ef7', P: '#22c55e', X: '#f87171' }[p.est] || '#ffffff'; x.font = fuente(800, 36);
  x.fillText(e.t.toUpperCase(), T.ancho / 2, alto - 100);
  x.fillStyle = '#6b7280'; x.font = fuente(600, 26); x.fillText(`Código ${String(p.id || '').toUpperCase()}${c.cierre ? ' · Sorteo ' + fecha(c.cierre) : ''}`, T.ancho / 2, alto - 52);
  lienzo.toBlob(blob => {
    const archivo = new File([blob], 'mi-ticket.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [archivo] })) navigator.share({ files: [archivo], title: c.titulo }).catch(() => descargar(blob));
    else descargar(blob);
  }, 'image/png');
  function descargar(blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mi-ticket.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('💾 Ticket guardado'); }
}
function dibujarTicket(x, X, Y, W, H, { c, p, numero, posicion, fuente }) {
  const talon = 250, serie = 64, corte = X + W - talon;
  x.save(); trazarRectanguloRedondeado(x, X, Y, W, H, 26); x.clip();
  const fondo = x.createLinearGradient(X, Y, X + W, Y + H); fondo.addColorStop(0, '#075b61'); fondo.addColorStop(.55, '#0b858b'); fondo.addColorStop(1, '#14aaae');
  x.fillStyle = fondo; x.fillRect(X, Y, W, H);
  x.fillStyle = '#05484d'; x.fillRect(X, Y, serie, H);
  x.fillStyle = '#e30613'; x.fillRect(corte, Y, talon, H);
  x.save(); x.beginPath(); x.rect(corte, Y, talon, H); x.clip();
  x.strokeStyle = '#c3040f'; x.lineWidth = 22;
  for (let k = -H; k < talon + H; k += 52) { x.beginPath(); x.moveTo(corte + k, Y + H); x.lineTo(corte + k + H, Y); x.stroke(); }
  x.restore();
  x.restore();
  x.fillStyle = '#080810'; [Y, Y + H].forEach(cy => { x.beginPath(); x.arc(corte, cy, 17, 0, Math.PI * 2); x.fill(); });
  x.strokeStyle = '#ffffff'; x.lineWidth = 4; x.setLineDash([12, 10]); x.beginPath(); x.moveTo(corte, Y + 20); x.lineTo(corte, Y + H - 20); x.stroke(); x.setLineDash([]);
  x.save(); x.translate(X + serie / 2 + 10, Y + H / 2); x.rotate(-Math.PI / 2); x.textAlign = 'center'; x.fillStyle = '#ffffff'; x.font = fuente(800, 24); x.fillText('N° ' + String(p.id || '').toUpperCase(), 0, 0); x.restore();
  const izq = X + serie + 30;
  x.textAlign = 'left';
  x.save(); x.translate(izq, Y + 34); x.transform(1, 0, -0.25, 1, 0, 0); x.fillStyle = '#e30613'; x.fillRect(0, 0, 250, 46); x.strokeStyle = '#ffffff'; x.lineWidth = 4; x.strokeRect(0, 0, 250, 46); x.restore();
  x.fillStyle = '#ffffff'; x.font = 'italic ' + fuente(800, 28); x.fillText((c.negocio || CONFIG.NEGOCIO).toUpperCase().slice(0, 14), izq + 14, Y + 68);
  x.font = fuente(800, 22); x.textAlign = 'right'; x.fillText(posicion.toUpperCase(), corte - 30, Y + 66);
  x.textAlign = 'left'; x.font = fuente(800, 36); x.fillText(String(c.titulo).slice(0, 30), izq, Y + 128);
  x.font = fuente(700, 30); x.fillText(String(p.nombre).toUpperCase().slice(0, 32), izq, Y + 172);
  if (c.cierre) { x.font = fuente(600, 22); x.globalAlpha = .9; x.fillText('Sorteo ' + fecha(c.cierre), izq, Y + 207); x.globalAlpha = 1; }
  x.textAlign = 'center'; x.fillStyle = '#ffffff'; x.font = fuente(800, 26); x.fillText('N°', corte + talon / 2, Y + 70);
  x.font = fuente(900, numero.length > 4 ? 72 : 92); x.fillText(numero, corte + talon / 2, Y + 160);
}
function trazarRectanguloRedondeado(x, X, Y, ancho, alto, radio) {
  x.beginPath(); x.moveTo(X + radio, Y);
  x.arcTo(X + ancho, Y, X + ancho, Y + alto, radio); x.arcTo(X + ancho, Y + alto, X, Y + alto, radio);
  x.arcTo(X, Y + alto, X, Y, radio); x.arcTo(X, Y, X + ancho, Y, radio); x.closePath();
}
function wrap(x, t, cx, y, mw, lh, maxL) {
  const w = String(t).split(' '); let l = '', n = 0;
  for (const p of w) { const tt = l ? l + ' ' + p : p; if (x.measureText(tt).width > mw && l) { x.fillText(l, cx, y + n * lh); l = p; if (++n >= maxL - 1) break; } else l = tt; }
  x.fillText(l, cx, y + n * lh);
}

let PD = null, pf = 'todos', pq = '';
async function vPart() {
  PD = await api(`/api/r/${encodeURIComponent(S.r)}/part`);
  const c = PD.cfg; S.cfg = c; mostrarBarra(false);
  const b = PD.board, pag = (b.match(/3/g) || []).length, lib = (b.match(/0/g) || []).length;
  let h = cabecera(c) + `
  <div class="card"><h2>👥 Participantes</h2><p class="mu sm" style="margin-top:-6px">${esc(c.titulo)}</p>
    <div class="stats3"><div><b class="c-ac">${PD.list.length}</b><span>Registros</span></div><div><b class="c-ok">${pag}</b><span>${c.modo === 'gratis' ? 'Confirmados' : 'Pagados'}</span></div><div><b>${lib}</b><span>Disponibles</span></div></div>
    ${c.cierre && !c.resultado ? `<p class="sm mu" style="margin-top:10px;text-align:center">📅 Sorteo: ${fechaL(c.cierre)}</p>` : ''}

  ${c.resultado ? resultadoHTML(c) : ''}

    <div class="chips" style="margin-top:8px">${[['todos', 'Todos'], ['P', '✅ Confirmados'], ['V', '🔎 En revisión'], ['R', '⏳ Reservados']].map(([k, t]) => `<button class="chip ${pf === k ? 'on' : ''}" data-pf="${k}">${t}</button>`).join('')}</div>
    <div id="plist"></div>
  </div>
  <div class="card"><details><summary>▦ Ver talonario completo</summary><div class="legend"><span><i></i>Libre</span><span><i style="background:#2a2410"></i>Reservado/revisión</span><span><i style="background:#173a2c"></i>Confirmado</span></div><div class="ngrid" id="ptal"></div></details></div>
  ${verifHTML(c)}
  ${!c.resultado && c.estado === 'activa' ? `<a class="btn ac full" href="${linkForm(S.r)}" style="margin-top:6px">🎟️ Quiero participar</a>` : ''}
  <p class="xs mu" style="text-align:center;margin-top:14px">Nombres y celulares ocultos para proteger los datos (Ley 29733). Se actualiza cada minuto.</p>`;
  app.innerHTML = h;
  renderPList();
  $('details').addEventListener('toggle', function () { if (this.open && !$('#ptal').innerHTML) { let t = ''; for (let i = 0; i < b.length; i++) t += `<div class="nb ${b[i] === '0' ? '' : 't'}" style="${b[i] === '3' ? 'background:#173a2c;border-color:#2ea04366;color:#56d364;text-decoration:none' : b[i] !== '0' ? 'background:#2a2410;border-color:#4a3d16;color:#c9a94e;text-decoration:none' : ''}">${fmtN(c, i)}</div>`; $('#ptal').innerHTML = t; } });
  $('#pq').oninput = e => { pq = e.target.value.trim().toLowerCase(); renderPList(); };
  clearTimeout(window._pr); window._pr = setTimeout(() => { if (document.visibilityState === 'visible' && !document.querySelector('.mod')) vPart().catch(() => {}); }, 60000);
}
function renderPList() {
  const c = PD.cfg, q = pq.replace(/^0+/, '');
  const ls = PD.list.filter(p => (pf === 'todos' || p.e === pf) && (!pq || p.n.toLowerCase().includes(pq) || p.c.includes(pq) || splitN(p.nums).some(i => String(i + baseOf(c)) === q || fmtN(c, i) === pq)));
  $('#plist').innerHTML = ls.length ? ls.slice().reverse().map(p => {
    const e = EST[p.e];
    return `<div class="pl"><div class="av">${esc(p.n[0] || '?')}</div><div class="i"><b>${esc(p.n)}</b><span class="xs mu">${esc(p.c)} · ${fecha(p.t)}</span><div class="ns">${splitN(p.nums).map(i => `<span>${fmtN(c, i)}</span>`).join('')}</div></div><span class="pill ${e.p}">${e.i}</span></div>`;
  }).join('') : `<p class="mu sm" style="padding:16px 0;text-align:center">${PD.list.length ? 'Sin resultados' : 'Aún no hay participantes. ¡Sé el primero!'}</p>`;
}
function resultadoHTML(c) {
  const R = c.resultado;
  return `<div class="card" style="border-color:#2ea04377"><h2>🏆 Resultado del sorteo</h2><p class="sm mu" style="margin-top:-6px">${fechaL(R.t)} · ${R.total} números participaron${R.resets ? ` · <span class="c-warn">sorteo repetido ${R.resets} vez(ces)</span>` : ''}</p>
    ${R.picks.map((pk, k) => `<div class="res ${k >= R.g ? 'sup' : ''}"><div class="n">${fmtN(c, pk.n)}</div><div class="sp"><b>${k < R.g ? `🏆 ${k + 1}° ${esc((c.premios || [])[k] || 'premio')}` : `🎗️ Suplente ${k - R.g + 1}`}</b><br><span class="sm">${esc(pk.nom)}</span></div></div>`).join('')}
  </div>`;
}
function verifHTML(c) {
  const R = c.resultado;
  return `<div class="card"><h2>🔐 Verificación</h2>
    <p class="sm mu">Antes de vender el primer número publicamos el <b>compromiso</b> (huella SHA-256) de una semilla secreta. Al sortear se revela la semilla y se combina con la lista de números pagados y un número aleatorio público de <a href="https://drand.love" target="_blank">drand</a>. Nadie puede cambiar el resultado sin que se note.</p>
    <p class="xs" style="margin-top:10px">Compromiso publicado</p><div class="mono">${esc(c.seedHash || '—')}</div>
    ${R ? `<p class="xs">Semilla revelada</p><div class="mono">${esc(R.seed)}</div>
      <p class="xs">Huella de la lista de números pagados</p><div class="mono">${esc(R.eh)}</div>
      <p class="xs">Aleatoriedad pública drand ${R.round ? `· ronda <a href="https://drand.cloudflare.com/public/${R.round}" target="_blank">#${R.round}</a>` : ''}</p><div class="mono">${esc(R.beacon || '(no disponible)')}</div>
      <button class="btn ac full" id="bVer">🔍 Verificar ahora en mi celular</button><div id="verOut" style="margin-top:10px"></div>`
    : `<p class="sm mu">La semilla se revelará al momento del sorteo.</p>`}

async function verificar() {
  const c = PD.cfg, R = c.resultado, out = $('#verOut'); out.innerHTML = '<span class="spin"></span>';
  try {
    const ok1 = (await sha(R.seed)) === c.seedHash;
    const { picks, eh } = await drawPicks(R.seed, R.snap, R.beacon, R.picks.length);
    const ok2 = eh === R.eh, ok3 = picks.join(',') === R.picks.map(p => p.n).join(',');

    out.innerHTML = L(ok1, 'La semilla coincide con el compromiso publicado') + L(ok2, `La lista de ${R.total} números pagados es la misma`) + L(ok3, 'Los ganadores se reproducen exactamente') +
      (ok1 && ok2 && ok3 ? '<p class="sm" style="margin-top:8px">🎉 Sorteo verificado: el resultado no fue manipulado.</p>' : '<p class="sm c-bad" style="margin-top:8px">⚠️ La verificación no coincide.</p>') +
      (R.round ? `<p class="xs mu" style="margin-top:6px">Puedes comprobar el número drand en el enlace de la ronda #${R.round}.</p>` : '');
  } catch (e) { out.innerHTML = `<p class="c-bad sm">No se pudo verificar en este navegador: ${esc(e.message)}</p>`; }
}

document.addEventListener('click', e => {
  const t = e.target;

  if ($('#hvB') && !t.closest('#hv')) $('#hvB').hidden = true;
  const pack = t.closest('[data-qty]'); if (pack) return elegirCantidad(+pack.dataset.qty);
  const pfb = t.closest('[data-pf]'); if (pfb) { pf = pfb.dataset.pf; $$('[data-pf]').forEach(b => b.classList.toggle('on', b === pfb)); return renderPList(); }
  const cp = t.closest('[data-c]'); if (cp) return copiar(cp.dataset.c);
  if (t.closest('#verBases')) { e.preventDefault(); return modal(`<h2 class="syne" style="margin-bottom:10px">📜 Bases del sorteo</h2><pre>${esc(S.cfg.bases || 'El organizador aún no publicó las bases. Puedes consultarlas por WhatsApp.')}</pre>`); }
  if (t.closest('#heroFoto')) return modal(`<img src="${pubImg(S.cfg.foto)}" style="width:100%;border-radius:14px">`);
  const ag = t.closest('[data-ag]'); if (ag) return agElegir(ag.dataset.ag);
  const ev = t.closest('[data-env]'); if (ev) return envElegir(ev.dataset.env);
  if (t.closest('#hvAv')) { if ($('#hvB').hidden && HV.ult) heavy(HV.ult); else $('#hvB').hidden = true; return; }
  if (t.closest('#hvX')) { $('#hvB').hidden = true; return; }
  if (t.id === 'qrImg') return modal(`<img src="${t.src}" style="width:100%;border-radius:14px;background:#fff;padding:10px"><a class="btn full" style="margin-top:10px" href="${t.src}" download="qr-pago">💾 Descargar QR</a>`);
  switch (t.closest('button')?.id) {
    case 'sbGo': return accionPrincipal();
    case 'dniSi': return dniAceptar();
    case 'dniNo': return dniCorregir();
    case 'agUbic': return agUbicar();
    case 'agCambiar': return agCambiar();

    case 'bVer': return verificar();

document.addEventListener('change', e => {
  if (e.target.id === 'despues' && e.target.checked && S.file) { toast('Se enviará sin comprobante (reserva)'); }
});
let aT; document.addEventListener('input', e => {

  if (id === 'agBusca') { clearTimeout(aT); aT = setTimeout(() => agBuscar(e.target.value), 200); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches?.('#fDni,#fNom,#fCel')) return;
  e.preventDefault();
  const siguienteCampo = { fDni: '#fNom', fNom: '#fCel' }[e.target.id];
  if (siguienteCampo && !$(siguienteCampo).readOnly) $(siguienteCampo).focus(); else accionPrincipal();
