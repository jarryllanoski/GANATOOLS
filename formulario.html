<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Sorteo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--bg2:#121a26;--card:#182234;--card2:#1f2b40;--line:#2a3a52;--tx:#e6edf3;--mu:#8fa0b6;--ac:#1fb6ff;--ac2:#388bfd;--ok:#22d38a;--wa:#25d366;--warn:#ffb020;--bad:#ff5c6c;--org:#ff7a45;--pur:#a371f7;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:radial-gradient(1100px 520px at 50% -180px,#1c2c44 0%,var(--bg) 62%) fixed,var(--bg);color:var(--tx);min-height:100vh;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac)}
h1,h2,h3,.syne{font-family:'Syne',sans-serif}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 130px}
.mu{color:var(--mu)} .sm{font-size:13.5px} .xs{font-size:12px} .c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-ac{color:var(--ac)}
.row{display:flex;align-items:center;gap:8px} .wrapf{flex-wrap:wrap} .sp{flex:1}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:0 8px 24px #0005}
.card h2{font-size:18px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#2fe39a,#13a86a);display:grid;place-items:center;font-size:21px;flex:none}
.top b{font-family:'Syne',sans-serif;font-weight:800;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.p-ok{color:var(--ok);background:#22d38a1f;border-color:#22d38a66}.p-warn{color:var(--warn);background:#ffb0201f;border-color:#ffb02066}.p-ac{color:var(--ac);background:#1fb6ff1f;border-color:#1fb6ff66}.p-bad{color:var(--bad);background:#ff5c6c1f;border-color:#ff5c6c66}.p-pur{color:#d6c2ff;background:#a371f72a;border-color:#a371f77a}
/* hero */
.hero{padding:0;overflow:hidden}
.hero img{width:100%;max-height:300px;object-fit:cover;display:block;background:#0a0f16}
.hero .b{padding:16px}
.hero h1{font-size:26px;font-weight:800;line-height:1.15;margin:8px 0 6px}
.prem{display:grid;gap:6px;margin:12px 0}
.prem div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.count div{text-align:center;padding:10px 0;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.count b{display:block;font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--ac)}
.count span{font-size:11px;color:var(--mu);text-transform:uppercase}
.bar{height:10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d38a,#1fb6ff);border-radius:99px;transition:width .6s}
/* inputs */
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:12px;font-weight:700;color:#b7c4d4;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:0;transition:border-color .15s}
.in:focus{border-color:var(--ac)}
.in.err{border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pre{display:flex}.pre>b{display:grid;place-items:center;padding:0 14px;background:var(--card2);border:1px solid var(--line);border-right:0;border-radius:14px 0 0 14px;font-weight:600}.pre .in{border-radius:0 14px 14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card2);transition:transform .12s;text-decoration:none;color:var(--tx)}
.btn:active{transform:scale(.97)} .btn[disabled]{opacity:.55;pointer-events:none}
.btn.ac{background:linear-gradient(135deg,#1fb6ff,#2f8cff);border-color:transparent;color:#fff}
.btn.ok{background:linear-gradient(135deg,#2fe39a,#16b072);border-color:transparent;color:#05261a}
.btn.wa{background:linear-gradient(135deg,#2fe07a,#1ea952);border-color:transparent;color:#05261a}
.btn.full{width:100%} .btn.sm{padding:9px 13px;font-size:13.5px;border-radius:11px}
/* numbers */
.tools{display:flex;gap:8px;margin:8px 0}
.tools .in{flex:1;padding:11px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;font-weight:700;font-size:13px;background:var(--bg2);border:1px solid var(--line)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#04131d}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px;margin-top:10px}
.nb{padding:12px 0;border-radius:12px;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;text-align:center;background:var(--bg2);border:1.5px solid #2f4462;color:#dfe9f5;transition:transform .1s,background .15s}
.nb:active{transform:scale(.92)}
.nb.t{background:#0f151f;border-color:#1c2636;color:#3f4f66;text-decoration:line-through;pointer-events:none}
.nb.t1{background:#2a2410;border-color:#4a3d16;color:#8a7536}
.nb.sel{background:linear-gradient(135deg,#1fb6ff,#2f8cff);border-color:#7fd6ff;color:#fff;box-shadow:0 4px 14px #1fb6ff55}
.nb.hl{animation:hl 1.2s 2}
@keyframes hl{50%{box-shadow:0 0 0 4px var(--warn)}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.selbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.num{font-family:'Syne',sans-serif;font-weight:800;padding:5px 11px;border-radius:10px;background:#1fb6ff1a;border:1px solid #1fb6ff55;color:#bfe9ff;font-size:15px}
.num button{margin-left:6px;color:#ffb3bb;font-weight:700}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.step button{width:52px;height:52px;border-radius:50%;font-size:26px;font-weight:800;background:var(--card2);border:1px solid var(--line)}
.step b{font-family:'Syne',sans-serif;font-size:44px;font-weight:800;min-width:70px;text-align:center}
/* pay */
.total{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:#22d38a14;border:1px solid #22d38a44;font-weight:700}
.total b{font-family:'Syne',sans-serif;font-size:26px;color:var(--ok)}
.payrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-top:10px}
.payrow .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.payrow .v{flex:1;min-width:0}.payrow .v b{display:block;font-family:'Syne',sans-serif;font-size:20px;letter-spacing:.5px}
.qrimg{display:block;max-width:240px;width:100%;margin:12px auto 0;border-radius:14px;background:#fff;padding:8px}
pre.bank{white-space:pre-wrap;font:inherit;font-size:14px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-top:10px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px 14px;border:2px dashed #3a5476;border-radius:16px;background:#1fb6ff0a;text-align:center;margin-top:12px;cursor:pointer}
.drop b{font-size:30px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop.has{border-style:solid;border-color:var(--ok);background:#22d38a10}
.prev{display:flex;gap:12px;align-items:center;margin-top:10px}
.prev img{width:80px;height:104px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.warnbox{padding:12px;border-radius:14px;background:#ffb02014;border:1px solid #ffb02055;font-size:13.5px;margin-top:12px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--ac)}
.sw{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:14px;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--warn)}
/* sticky bar */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0d1117 30%);}
.sbar .in2{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:18px;background:#182234f2;border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 10px 30px #000a}
.sbar b{font-family:'Syne',sans-serif;font-size:18px;display:block;line-height:1.1}
.sbar .btn{flex:none}
/* ticket */
.ticket{border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#21324d,#152033);border:1px solid #33496a;box-shadow:0 14px 34px #000a;margin:14px 0}
.tk-h{padding:18px;background:linear-gradient(135deg,#1fb6ff,#2f6dff);color:#fff}
.tk-h small{display:block;font-weight:700;opacity:.85;letter-spacing:1px;font-size:12px}
.tk-h b{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;line-height:1.15;display:block;margin-top:2px}
.tk-b{padding:18px}
.tk-name{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;text-transform:uppercase}
.tk-nums{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tk-nums span{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;padding:6px 16px;border-radius:14px;background:#0d1117;border:2px solid #1fb6ff;color:#fff}
.tk-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed #33496a;font-size:14px}
.tk-perf{height:22px;position:relative;background:radial-gradient(circle at 0 50%,var(--bg) 11px,transparent 12px),radial-gradient(circle at 100% 50%,var(--bg) 11px,transparent 12px);border-top:2px dashed #33496a;margin:0}
.tk-f{padding:12px 18px 16px;text-align:center;font-size:13px;color:var(--mu)}
.win{padding:16px;border-radius:18px;background:linear-gradient(135deg,#22d38a2a,#ffb02022);border:1px solid #22d38a88;text-align:center;font-weight:700;font-size:17px}
.win b{font-family:'Syne',sans-serif;font-size:26px;display:block}
.acts{display:grid;gap:10px;margin:14px 0}
/* participants */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats3 div{text-align:center;padding:12px 4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.stats3 b{display:block;font-family:'Syne',sans-serif;font-size:24px;font-weight:800}
.stats3 span{font-size:11.5px;color:var(--mu)}
.pl{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #2a3a5280}
.pl:first-child{border-top:0}
.pl .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#1fb6ff22;color:var(--ac);flex:none}
.pl .i{flex:1;min-width:0}.pl .i b{display:block}
.pl .ns{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pl .ns span{font-family:'Syne',sans-serif;font-weight:800;font-size:12.5px;padding:2px 7px;border-radius:7px;background:var(--bg2);border:1px solid var(--line)}
.res{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-top:8px}
.res .n{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;color:var(--ok);min-width:64px;text-align:center}
.res.sup .n{color:var(--mu)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all;color:#a9bbd0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;margin:4px 0 10px}
.vok{color:var(--ok);font-weight:700}.vko{color:var(--bad);font-weight:700}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
/* misc */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(30px);opacity:0;background:#0b1220f5;border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:600;z-index:80;transition:.25s;max-width:92vw;text-align:center;box-shadow:0 10px 30px #0008;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.toast.bad{border-color:var(--bad);color:#ffc6cc}.toast.ok{border-color:var(--ok)}
.mod{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.mod .box{position:relative;background:linear-gradient(170deg,#1f2b40,#141d2c);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto}
.mod .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--bg2);border:1px solid var(--line)}
.mod pre{white-space:pre-wrap;font:inherit;font-size:14px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:20px}
.center b.e{font-size:56px;display:block;margin-bottom:10px}
.spin{width:18px;height:18px;border:2.5px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.big{width:36px;height:36px;border-color:#1fb6ff44;border-top-color:var(--ac)}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{padding:14px;border-radius:16px;text-align:center;font-weight:700;margin:14px 0}
.mine{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#a371f71f;border:1px solid #a371f766;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><span class="spin big"></span></div></div>
<div class="sbar" id="sbar" hidden><div class="in2"><div class="sp"><b id="sbN">0 números</b><span class="mu sm" id="sbT"></span></div><button class="btn ac" id="sbGo">Participar ➜</button></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONFIG — edita aquí
   ===================================================================== */
const CONFIG = {
  API: '',              // URL de tu Worker, ej: https://sorteos.tuusuario.workers.dev
  NEGOCIO: 'TOTAL TOOLS',
  PAGE: 200,            // números por página en la grilla
};

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem('sxf_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('sxf_' + k, JSON.stringify(v)); } catch (e) {} };
const fmtS = n => 'S/ ' + (+n || 0).toFixed(2);
const baseOf = c => (c.base === 0 ? 0 : 1);
const digs = c => String((c.cantidad || 1) - 1 + baseOf(c)).length;
const fmtN = (c, i) => String(i + baseOf(c)).padStart(digs(c), '0');
const splitN = s => String(s || '').split(',').filter(x => x !== '').map(Number);
const fechaL = t => t ? new Date(t).toLocaleString('es-PE', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
const fecha = t => t ? new Date(t).toLocaleString('es-PE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const EST = { R: { t: 'Reservado · falta pagar', p: 'p-warn', i: '⏳' }, V: { t: 'Pago en revisión', p: 'p-ac', i: '🔎' }, P: { t: 'Confirmado', p: 'p-ok', i: '✅' }, X: { t: 'Anulado', p: 'p-bad', i: '✖️' } };
const enc = s => new TextEncoder().encode(s);
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const sha = async s => hex(await crypto.subtle.digest('SHA-256', typeof s === 'string' ? enc(s) : s));
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const API_URL = () => CONFIG.API.replace(/\/$/, '');
const pubImg = k => k ? API_URL() + '/pub/' + k : '';
const here = () => location.href.split('?')[0];
const linkBoleto = tok => `${here()}?t=${tok}`;
const linkPart = r => `${here()}?r=${r}&v=p`;
const linkForm = r => `${here()}?r=${r}`;

function toast(msg, tipo = '') { const t = $('#toast'); t.textContent = msg; t.className = 'toast on ' + tipo; clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200); }
function modal(html) {
  const m = document.createElement('div'); m.className = 'mod';
  m.innerHTML = `<div class="box"><button class="x" data-x>✕</button>${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) m.remove(); });
  document.body.appendChild(m); return m;
}
async function copiar(t) {
  try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('📋 Copiado');
}
function waURL(num, text) { let n = String(num || '').replace(/\D/g, ''); if (n.length === 9) n = '51' + n; return 'https://wa.me/' + n + '?text=' + encodeURIComponent(text); }
function precioTotal(c, k) {
  const pu = +c.precio || 0, promos = (c.promos || []).filter(p => p.n > 1), best = [0];
  for (let i = 1; i <= k; i++) { let v = best[i - 1] + pu; for (const p of promos) if (i >= p.n) v = Math.min(v, best[i - p.n] + p.p); best[i] = v; }
  return Math.round(best[k] * 100) / 100;
}
async function comprimir(file, max = 1280, q = 0.75) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se pudo leer la imagen')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let b = await new Promise(r => cv.toBlob(r, 'image/webp', q));
    if (!b || b.type !== 'image/webp') b = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    return b;
  } finally { URL.revokeObjectURL(url); }
}
async function api(path, opt = {}) {
  let r;
  try { r = await fetch(API_URL() + path, { method: opt.body ? 'POST' : 'GET', body: opt.body }); }
  catch (e) { throw new Error('Sin conexión. Revisa tu internet e intenta de nuevo.'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('Error del servidor (' + r.status + ')'); }
  if (!r.ok || j.ok === false) { const e = new Error(j.error || 'Error ' + r.status); e.status = r.status; throw e; }
  return j;
}
function cuenta(el, t, fin) {
  const tick = () => {
    const d = t - Date.now(); if (!document.body.contains(el)) return clearInterval(h);
    if (d <= 0) { clearInterval(h); fin && fin(); return; }
    const D = Math.floor(d / 864e5), H = Math.floor(d / 36e5) % 24, M = Math.floor(d / 6e4) % 60, Sg = Math.floor(d / 1e3) % 60;
    el.innerHTML = el.dataset.mode === 'mini' ? `${D ? D + 'd ' : ''}${String(H).padStart(2, '0')}:${String(M).padStart(2, '0')}:${String(Sg).padStart(2, '0')}`

/* Sorteo verificable — mismo algoritmo que el servidor */
async function drawPicks(seed, snap, beacon, k) {
  const paid = []; for (let i = 0; i < snap.length; i++) if (snap[i] === '1') paid.push(i);
  const eh = await sha(paid.join(','));
  const key = await crypto.subtle.importKey('raw', enc(seed), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const pool = paid.slice(), out = [];
  for (let j = 0; j < k && pool.length; j++) {
    const h = hex(await crypto.subtle.sign('HMAC', key, enc(`${eh}:${beacon}:${j}`)));
    out.push(pool.splice(Number(BigInt('0x' + h.slice(0, 13)) % BigInt(pool.length)), 1)[0]);
  }
  return { picks: out, eh };
}

  ${nuevo ? `<div class="banner card" style="background:linear-gradient(135deg,#22d38a26,#1fb6ff1a);border-color:#22d38a77">🎉 ¡Registro enviado!<br><span class="sm mu" style="font-weight:500">Envía tu registro por WhatsApp para que lo atendamos más rápido 👇</span></div>` : ''}
  ${gane.length ? gane.map(g => `<div class="win">${g.k < R.g ? `🏆 ¡GANASTE EL ${g.k + 1}° PREMIO!<b>${fmtN(c, g.n)}</b>${esc((c.premios || [])[g.k] || '')}` : `🎗️ Quedaste como suplente ${g.k - R.g + 1}<b>${fmtN(c, g.n)}</b>`}</div>`).join('') : ''}
  <div class="ticket">
    <div class="tk-h"><small>🎟️ ${esc((c.negocio || CONFIG.NEGOCIO).toUpperCase())}</small><b>${esc(c.titulo)}</b></div>
    <div class="tk-b">
      <div class="tk-name">${esc(p.nombre)}</div><div class="sm mu">📞 ${esc(p.celFull || p.cel)}</div>
      <div class="tk-nums">${nums.map(i => `<span>${fmtN(c, i)}</span>`).join('')}</div>
      <div class="tk-row"><span class="mu">Estado</span><span class="pill ${e.p}">${e.i} ${vencido ? 'Reserva vencida' : e.t}</span></div>
      ${c.modo === 'pago' ? `<div class="tk-row"><span class="mu">Monto</span><b>${fmtS(p.monto)}</b></div>` : ''}
      ${p.op ? `<div class="tk-row"><span class="mu">N° operación</span><b>${esc(p.op)}</b></div>` : ''}
      <div class="tk-row"><span class="mu">Registrado</span><span>${fecha(p.creado || Date.now())}</span></div>
      ${c.cierre ? `<div class="tk-row"><span class="mu">Sorteo</span><span>${fecha(c.cierre)}</span></div>` : ''}
      ${p.est === 'R' && p.vence ? `<div class="tk-row"><span class="c-warn">⏳ Reserva vence en</span><b class="c-warn" id="rv" data-mode="mini"></b></div>` : ''}
    </div>
    <div class="tk-perf"></div>

  <p class="sm" style="text-align:center;margin:0 6px">${expl}</p>
  <div class="acts">
    <a class="btn wa full" id="bWa" href="${c.wa ? waURL(c.wa, waN) : '#'}" target="_blank">💬 Enviar ${nuevo ? 'mi registro' : ''} por WhatsApp</a>
    <div class="row"><button class="btn sp" id="bDesc">💾 Guardar boleto</button><button class="btn sp" data-c="${esc(linkBoleto(tok))}">🔗 Copiar link</button></div>
  </div>`;
  if (puedePagar) h += `<div class="card" id="secPay"><h2>${p.est === 'V' ? '🔁 ¿Te equivocaste de captura?' : '💳 Paga y sube tu comprobante'}</h2>${pagoHTML(c, p.monto)}${subidaHTML(c, false)}<button class="btn ac full" id="bPagar" style="margin-top:12px">📤 ${p.est === 'V' ? 'Reemplazar comprobante' : 'Enviar comprobante'}</button></div>`;
  h += `<div class="acts"><a class="btn full" href="${linkPart(S.r)}">👥 Ver participantes</a>${!R && c.estado === 'activa' ? `<a class="btn full" href="${linkForm(S.r)}">➕ Elegir más números</a>` : ''}</div>`;
  const otros = misBoletos(S.r).filter(t => t !== tok);
  if (otros.length) h += `<div class="card"><h2>🎟️ Mis otros registros</h2>${otros.map((t, i) => `<a class="btn full sm" style="margin-top:6px" href="${linkBoleto(t)}">Registro ${otros.length - i}</a>`).join('')}</div>`;
  app.innerHTML = h;
  if ($('#rv')) cuenta($('#rv'), p.vence, () => setTimeout(() => location.reload(), 1500));
  if (!c.wa) $('#bWa').onclick = ev => { ev.preventDefault(); toast('El organizador no configuró su WhatsApp', 'bad'); };
  $('#bDesc').onclick = () => boletoPNG(c, p, nums, tok);
  bindSubida();
  if ($('#bPagar')) $('#bPagar').onclick = () => pagoTardio(tok, c, p);
  if (nuevo && c.wa && isMobile) setTimeout(() => { location.href = waURL(c.wa, waN); }, 900);
}
async function pagoTardio(tok, c, p) {
  if (!S.file) return marcarErr($('#drop'), 'Sube la foto de tu comprobante');
  const op = ($('#fOp')?.value || '').replace(/\s/g, '');
  if (c.opObl !== false && !op) return marcarErr($('#fOp'), 'Escribe el N° de operación');
  const fd = new FormData(); fd.append('img', S.file, 'comprobante.' + (S.file.type === 'image/webp' ? 'webp' : 'jpg')); fd.append('ih', S.ih); fd.append('op', op);
  const b = $('#bPagar'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Enviando…';
  try {
    await api(`/api/t/${encodeURIComponent(tok)}/pago`, { body: fd });
    S.file = null; toast('✅ Comprobante enviado', 'ok');
    const msg = msgNegocio(c, { ...p, op, est: 'V' }, tok, 'COMPROBANTE ENVIADO');
    await vBoleto(tok);
    if (c.wa) { if (isMobile) location.href = waURL(c.wa, msg); else window.open(waURL(c.wa, msg), '_blank'); }
  } catch (e) { toast(e.message, 'bad'); b.disabled = false; b.innerHTML = '📤 Enviar comprobante'; }
}
function boletoPNG(c, p, nums, tok) {
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1c2c44'); g.addColorStop(1, '#0d1117'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  const hg = x.createLinearGradient(0, 0, W, 0); hg.addColorStop(0, '#1fb6ff'); hg.addColorStop(1, '#2f6dff');
  rr(x, 60, 60, W - 120, H - 120, 40); x.fillStyle = '#182234'; x.fill(); x.save(); x.clip(); x.fillStyle = hg; x.fillRect(60, 60, W - 120, 260); x.restore();
  x.textAlign = 'center'; x.fillStyle = '#ffffffcc'; x.font = '700 34px DM Sans, sans-serif'; x.fillText('🎟️ ' + (c.negocio || CONFIG.NEGOCIO).toUpperCase(), W / 2, 140);
  x.fillStyle = '#fff'; x.font = '800 58px Syne, sans-serif'; wrap(x, c.titulo, W / 2, 220, W - 200, 64, 2);
  x.fillStyle = '#e6edf3'; x.font = '800 54px Syne, sans-serif'; x.fillText(String(p.nombre).toUpperCase().slice(0, 28), W / 2, 420);
  x.fillStyle = '#8fa0b6'; x.font = '600 32px DM Sans, sans-serif'; x.fillText('Mis números', W / 2, 500);
  const txt = nums.map(i => fmtN(c, i)), fs = txt.length > 12 ? 52 : txt.length > 6 ? 70 : 100;
  x.fillStyle = '#fff'; x.font = `800 ${fs}px Syne, sans-serif`;
  const lines = []; let cur = '';
  for (const t of txt) { const nx = cur ? cur + '  ' + t : t; if (x.measureText(nx).width > W - 220) { lines.push(cur); cur = t; } else cur = nx; }
  lines.push(cur); lines.slice(0, 5).forEach((l, i) => x.fillText(l, W / 2, 610 + i * (fs + 18)));
  const e = EST[p.est] || EST.R, col = { R: '#ffb020', V: '#1fb6ff', P: '#22d38a', X: '#ff5c6c' }[p.est];
  x.fillStyle = col; x.font = '800 44px DM Sans, sans-serif'; x.fillText(e.i + ' ' + e.t, W / 2, 1010);
  x.strokeStyle = '#33496a'; x.setLineDash([16, 12]); x.lineWidth = 3; x.beginPath(); x.moveTo(110, 1070); x.lineTo(W - 110, 1070); x.stroke(); x.setLineDash([]);
  x.fillStyle = '#8fa0b6'; x.font = '600 30px DM Sans, sans-serif';
  if (c.cierre) x.fillText('Sorteo: ' + fecha(c.cierre), W / 2, 1130);
  x.fillText('Código ' + String(p.id || '').toUpperCase(), W / 2, 1180);
  x.fillStyle = '#1fb6ff'; x.font = '600 24px DM Sans, sans-serif'; x.fillText(linkBoleto(tok).replace(/^https?:\/\//, '').slice(0, 70), W / 2, 1230);
  cv.toBlob(b => {
    const f = new File([b], 'mi-boleto.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f], title: c.titulo }).catch(() => dl(b));
    else dl(b);
  }, 'image/png');
  function dl(b) { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'mi-boleto.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('💾 Boleto descargado'); }
}
function rr(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function wrap(x, t, cx, y, mw, lh, maxL) {
  const w = String(t).split(' '); let l = '', n = 0;
  for (const p of w) { const tt = l ? l + ' ' + p : p; if (x.measureText(tt).width > mw && l) { x.fillText(l, cx, y + n * lh); l = p; if (++n >= maxL - 1) break; } else l = tt; }
  x.fillText(l, cx, y + n * lh);
}

/* =====================================================================
   VISTA: PARTICIPANTES (transparencia)
   ===================================================================== */
let PD = null, pf = 'todos', pq = '';
async function vPart() {
  PD = await api(`/api/r/${encodeURIComponent(S.r)}/part`);
  const c = PD.cfg; S.cfg = c; $('#sbar').hidden = true;
  const b = PD.board, pag = (b.match(/3/g) || []).length, lib = (b.match(/0/g) || []).length;
  let h = cabecera(c) + `
  <div class="card"><h2>👥 Participantes</h2><p class="mu sm" style="margin-top:-6px">${esc(c.titulo)}</p>
    <div class="stats3"><div><b class="c-ac">${PD.list.length}</b><span>Registros</span></div><div><b class="c-ok">${pag}</b><span>${c.modo === 'gratis' ? 'Confirmados' : 'Pagados'}</span></div><div><b>${lib}</b><span>Disponibles</span></div></div>
    ${c.cierre && !c.resultado ? `<p class="sm mu" style="margin-top:10px;text-align:center">📅 Sorteo: ${fechaL(c.cierre)}</p>` : ''}
  </div>
  ${c.resultado ? resultadoHTML(c) : ''}
  <div class="card">
    <input class="in" id="pq" placeholder="🔎 Busca tu nombre o número">
    <div class="chips" style="margin-top:8px">${[['todos', 'Todos'], ['P', '✅ Confirmados'], ['V', '🔎 En revisión'], ['R', '⏳ Reservados']].map(([k, t]) => `<button class="chip ${pf === k ? 'on' : ''}" data-pf="${k}">${t}</button>`).join('')}</div>
    <div id="plist"></div>
  </div>
  <div class="card"><details><summary>▦ Ver talonario completo</summary><div class="legend"><span><i></i>Libre</span><span><i style="background:#2a2410"></i>Reservado/revisión</span><span><i style="background:#173a2c"></i>Confirmado</span></div><div class="ngrid" id="ptal"></div></details></div>
  ${verifHTML(c)}
  ${!c.resultado && c.estado === 'activa' ? `<a class="btn ac full" href="${linkForm(S.r)}" style="margin-top:6px">🎟️ Quiero participar</a>` : ''}
  <p class="xs mu" style="text-align:center;margin-top:14px">Nombres y celulares ocultos para proteger los datos (Ley 29733). Se actualiza cada minuto.</p>`;
  app.innerHTML = h;
  renderPList();
  $('details').addEventListener('toggle', function () { if (this.open && !$('#ptal').innerHTML) { let t = ''; for (let i = 0; i < b.length; i++) t += `<div class="nb ${b[i] === '0' ? '' : 't'}" style="${b[i] === '3' ? 'background:#173a2c;border-color:#22d38a66;color:#9cf3cb;text-decoration:none' : b[i] !== '0' ? 'background:#2a2410;border-color:#4a3d16;color:#c9a94e;text-decoration:none' : ''}">${fmtN(c, i)}</div>`; $('#ptal').innerHTML = t; } });
  $('#pq').oninput = e => { pq = e.target.value.trim().toLowerCase(); renderPList(); };
  clearTimeout(window._pr); window._pr = setTimeout(() => { if (document.visibilityState === 'visible' && !document.querySelector('.mod')) vPart().catch(() => {}); }, 60000);
}
function renderPList() {
  const c = PD.cfg, q = pq.replace(/^0+/, '');
  const ls = PD.list.filter(p => (pf === 'todos' || p.e === pf) && (!pq || p.n.toLowerCase().includes(pq) || p.c.includes(pq) || splitN(p.nums).some(i => String(i + baseOf(c)) === q || fmtN(c, i) === pq)));
  $('#plist').innerHTML = ls.length ? ls.slice().reverse().map(p => {
    const e = EST[p.e];
    return `<div class="pl"><div class="av">${esc(p.n[0] || '?')}</div><div class="i"><b>${esc(p.n)}</b><span class="xs mu">${esc(p.c)} · ${fecha(p.t)}</span><div class="ns">${splitN(p.nums).map(i => `<span>${fmtN(c, i)}</span>`).join('')}</div></div><span class="pill ${e.p}">${e.i}</span></div>`;
  }).join('') : `<p class="mu sm" style="padding:16px 0;text-align:center">${PD.list.length ? 'Sin resultados' : 'Aún no hay participantes. ¡Sé el primero!'}</p>`;
}
function resultadoHTML(c) {
  const R = c.resultado;
  return `<div class="card" style="border-color:#22d38a77"><h2>🏆 Resultado del sorteo</h2><p class="sm mu" style="margin-top:-6px">${fechaL(R.t)} · ${R.total} números participaron${R.resets ? ` · <span class="c-warn">sorteo repetido ${R.resets} vez(ces)</span>` : ''}</p>
    ${R.picks.map((pk, k) => `<div class="res ${k >= R.g ? 'sup' : ''}"><div class="n">${fmtN(c, pk.n)}</div><div class="sp"><b>${k < R.g ? `🏆 ${k + 1}° ${esc((c.premios || [])[k] || 'premio')}` : `🎗️ Suplente ${k - R.g + 1}`}</b><br><span class="sm">${esc(pk.nom)}</span></div></div>`).join('')}
  </div>`;
}
function verifHTML(c) {
  const R = c.resultado;
  return `<div class="card"><h2>🔐 Verificación</h2>
    <p class="sm mu">Antes de vender el primer número publicamos el <b>compromiso</b> (huella SHA-256) de una semilla secreta. Al sortear se revela la semilla y se combina con la lista de números pagados y un número aleatorio público de <a href="https://drand.love" target="_blank">drand</a>. Nadie puede cambiar el resultado sin que se note.</p>
    <p class="xs" style="margin-top:10px">Compromiso publicado</p><div class="mono">${esc(c.seedHash || '—')}</div>
    ${R ? `<p class="xs">Semilla revelada</p><div class="mono">${esc(R.seed)}</div>
      <p class="xs">Huella de la lista de números pagados</p><div class="mono">${esc(R.eh)}</div>
      <p class="xs">Aleatoriedad pública drand ${R.round ? `· ronda <a href="https://drand.cloudflare.com/public/${R.round}" target="_blank">#${R.round}</a>` : ''}</p><div class="mono">${esc(R.beacon || '(no disponible)')}</div>
      <button class="btn ac full" id="bVer">🔍 Verificar ahora en mi celular</button><div id="verOut" style="margin-top:10px"></div>`
    : `<p class="sm mu">La semilla se revelará al momento del sorteo.</p>`}
  </div>`;
}
async function verificar() {
  const c = PD.cfg, R = c.resultado, out = $('#verOut'); out.innerHTML = '<span class="spin"></span>';
  try {
    const ok1 = (await sha(R.seed)) === c.seedHash;
    const { picks, eh } = await drawPicks(R.seed, R.snap, R.beacon, R.picks.length);
    const ok2 = eh === R.eh, ok3 = picks.join(',') === R.picks.map(p => p.n).join(',');
    const L = (ok, t) => `<div class="${ok ? 'vok' : 'vko'}">${ok ? '✅' : '❌'} ${t}</div>`;
    out.innerHTML = L(ok1, 'La semilla coincide con el compromiso publicado') + L(ok2, `La lista de ${R.total} números pagados es la misma`) + L(ok3, 'Los ganadores se reproducen exactamente') +
      (ok1 && ok2 && ok3 ? '<p class="sm" style="margin-top:8px">🎉 Sorteo verificado: el resultado no fue manipulado.</p>' : '<p class="sm c-bad" style="margin-top:8px">⚠️ La verificación no coincide.</p>') +
      (R.round ? `<p class="xs mu" style="margin-top:6px">Puedes comprobar el número drand en el enlace de la ronda #${R.round}.</p>` : '');
  } catch (e) { out.innerHTML = `<p class="c-bad sm">No se pudo verificar en este navegador: ${esc(e.message)}</p>`; }
}

/* =====================================================================

document.addEventListener('click', e => {
  const t = e.target;
  const nb = t.closest('#grid .nb[data-n]'); if (nb) return toggleNum(+nb.dataset.n);
  const rm = t.closest('[data-rm]'); if (rm) { S.sel.delete(+rm.dataset.rm); renderGrid(); return renderSel(); }
  const pg = t.closest('[data-pg]'); if (pg) { S.page = +pg.dataset.pg; renderPages(); return renderGrid(); }
  const pfb = t.closest('[data-pf]'); if (pfb) { pf = pfb.dataset.pf; $$('[data-pf]').forEach(b => b.classList.toggle('on', b === pfb)); return renderPList(); }
  const cp = t.closest('[data-c]'); if (cp) return copiar(cp.dataset.c);
  if (t.closest('#verBases')) { e.preventDefault(); return modal(`<h2 class="syne" style="margin-bottom:10px">📜 Bases del sorteo</h2><pre>${esc(S.cfg.bases || 'El organizador aún no publicó las bases. Puedes consultarlas por WhatsApp.')}</pre>`); }
  if (t.id === 'qrImg') return modal(`<img src="${t.src}" style="width:100%;border-radius:14px;background:#fff;padding:10px"><a class="btn full" style="margin-top:10px" href="${t.src}" download="qr-pago">💾 Descargar QR</a>`);
  switch (t.closest('button')?.id) {
    case 'sbGo': return enviar();
    case 'azar': return alAzar();
    case 'qm': S.qty = Math.max(1, S.qty - 1); $('#qn').textContent = S.qty; return actBar();
    case 'qp': S.qty = Math.min(S.cfg.maxSel || 20, S.cfg.maxPer || 500, S.qty + 1); $('#qn').textContent = S.qty; return actBar();
    case 'quitar': S.file = null; $('#prev').hidden = true; $('#drop').hidden = false; $('#drop').classList.remove('has'); $('#fFile').value = ''; return;
    case 'bVer': return verificar();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'soloLib') { S.soloLib = e.target.checked; renderGrid(); }
  if (e.target.id === 'despues' && e.target.checked && S.file) { toast('Se enviará sin comprobante (reserva)'); }
});
let bT; document.addEventListener('input', e => { if (e.target.id === 'busca') { clearTimeout(bT); bT = setTimeout(() => buscarNum(e.target.value), 350); } if (e.target.id === 'fCel') e.target.value = e.target.value.replace(/[^\d ]/g, ''); });

boot();
</script>
