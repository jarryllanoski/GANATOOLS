<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Sorteos · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
/* Paleta y medidas de Total-Tools (panel.css) */
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--card:#1c2333;--card2:#1c2333;--line:#30363d;--tx:#e6edf3;--mu:#8b949e;--ac:#388bfd;--ac2:#1a5fbf;--ok:#2ea043;--wa:#2ea043;--warn:#d29922;--bad:#f78166;--org:#db6d28;--pur:#a371f7;--r:11px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:13px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac)}
.syne,h1,h2,h3{font-family:'Syne',sans-serif}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:0 0 90px}
.wrap>section{padding:0 14px}
.mu{color:var(--mu)} .sm{font-size:12px} .xs{font-size:11px}
.row{display:flex;align-items:center;gap:7px} .row.wrapf{flex-wrap:wrap} .sp{flex:1}
.card{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:14px;margin:0 0 12px}
.card h3{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:7px;margin-bottom:12px;font-family:'DM Sans',sans-serif}
/* header (.hdr) */
.top{display:flex;align-items:center;gap:10px;height:60px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--ok),#1a7f37);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.top h1{font-size:16px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{display:flex;gap:8px;align-items:center;margin-top:1px}
.top .sub .mu{font-size:11px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid;white-space:nowrap}
.p-pur{color:var(--pur);background:#a371f726;border-color:#a371f759}
.p-ok{color:var(--ok);background:#2ea0431f;border-color:#2ea04366}
.p-warn{color:var(--warn);background:#d299221f;border-color:#d2992266}
.p-ac{color:var(--ac);background:#1a3a6b;border-color:var(--ac)}
.p-bad{color:var(--bad);background:#f781661f;border-color:#f7816666}
.ibtn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--bg3);border:1px solid var(--line);color:var(--mu);flex:none}
.ibtn:active{opacity:.75}
.ibtn.out{background:#2d1b1b;border-color:var(--bad);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--bad);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.bell.ring{animation:ring .9s ease 3;border-color:var(--warn)}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-6deg)}}
.badge-n{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:9px;font-weight:700;border-radius:20px;padding:1px 5px}
/* barra de sorteos (chips) */
.rbar{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--bg2);scrollbar-width:none}
.rbar::-webkit-scrollbar{display:none}
.rchip{white-space:nowrap;padding:6px 13px;border-radius:20px;background:var(--bg2);border:1.5px solid var(--line);color:var(--mu);font-weight:700;font-size:11px;flex:none}
.rchip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rchip.add{border-style:dashed;border-color:#388bfd4d;background:#388bfd14;color:var(--ac)}
/* tabs */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:40;margin-bottom:14px}
.tab{flex:1;padding:11px 4px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Syne',sans-serif;font-size:26px;font-weight:800;line-height:1.15}
.stat span{display:block;font-size:10px;color:var(--mu);margin-top:2px}
.c-ok{color:var(--ok)} .c-org{color:var(--org)} .c-ac{color:var(--ac)} .c-pur{color:var(--pur)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}
.money{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:10px;background:#2ea0431a;border:1px solid #2ea04359;font-size:12px;font-weight:600}
.money b{font-family:'Syne',sans-serif;font-size:18px;color:var(--ok)}
/* toolbar: buscador + chips */
.search{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.search input{flex:1;background:none;border:0;outline:0;font-size:12px;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 13px;border-radius:20px;font-weight:700;font-size:11px;background:var(--bg2);border:1.5px solid var(--line);color:var(--mu);flex:none;scroll-snap-align:start}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.tools .ibtn{width:36px;height:36px;background:var(--bg2);font-size:14px}
.ibtn.pri{background:var(--ac)!important;border-color:var(--ac);color:#fff}
.ibtn.gold{background:#d299221f!important;border-color:var(--warn);color:var(--warn)}
/* tarjetas de participantes (.card de Total-Tools) */
.pcard{position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:0 0 10px;border-left:3px solid var(--line)}
.pcard.e-R{border-left-color:var(--warn)} .pcard.e-V{border-left-color:var(--ac)} .pcard.e-P{border-left-color:var(--ok)} .pcard.e-X{border-left-color:var(--bad);opacity:.7}
.pname{font-weight:600;font-size:14px;line-height:1.3;padding-right:70px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin:5px 0;font-size:11px;color:var(--ac);padding-right:70px}
.meta a,.meta span{display:inline-flex;align-items:center;gap:4px}
.lnk{color:var(--ac);font-weight:700}
.nums{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.num{font-family:'Syne',sans-serif;font-weight:800;padding:3px 9px;border-radius:7px;background:#388bfd1f;border:1px solid #388bfd59;color:#79c0ff;font-size:12px}
.comp{display:flex;gap:10px;align-items:center;margin:7px 0;padding:9px;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.thumb{width:64px;height:84px;border-radius:9px;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex:none}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:8px;font-weight:700;font-size:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--tx)}
.btn:active{opacity:.75}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.ac{background:linear-gradient(135deg,var(--ac),#1a5fbf);border-color:transparent;color:#fff;font-family:'Syne',sans-serif}
.btn.ok{background:#2ea0431f;border-color:#2ea04366;color:var(--ok)}
.btn.wa{background:#2ea0431f;border-color:#2ea04366;color:var(--ok)}
.btn.bad{background:#f781661f;border-color:#f7816666;color:var(--bad)}
.btn.warn{background:#d299221f;border-color:#d2992266;color:var(--warn)}
.btn.pur{background:#a371f71f;border-color:#a371f766;color:var(--pur)}
.btn.full{width:100%;padding:13px;font-size:14px;border-radius:10px} .btn.sm{padding:7px 11px;font-size:11px;border-radius:7px}
.mini{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line);font-size:13px}
.mini.wa{background:#2ea0431a;border-color:#2ea04333;color:var(--ok)}
.pacts{position:absolute;top:10px;right:12px;display:flex;gap:5px}
.empty{text-align:center;padding:36px 16px;color:var(--mu);font-size:13px}
.empty b{display:block;font-size:40px;margin-bottom:8px}
/* talonario */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;margin-top:10px}
.nb{padding:9px 0;border-radius:7px;font-family:'Syne',sans-serif;font-weight:800;font-size:12px;text-align:center;background:var(--bg2);border:1px solid var(--line);color:var(--tx)}
.nb.s1{background:#d299221f;border-color:#d2992266;color:#e3b341}
.nb.s2{background:#388bfd1f;border-color:#388bfd66;color:#79c0ff}
.nb.s3{background:#2ea0431f;border-color:#2ea04366;color:#56d364}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
/* formularios (.fg/.fl/.fi) */
.fld{display:block;margin:0 0 11px}
.fld>span{display:block;font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.in,.fld input:not([type=checkbox]),.fld textarea,.fld select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;outline:0;-webkit-appearance:none}
.in:focus,.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ac)}
.fld textarea,textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 9px}
.pre{display:flex}
.pre>b{display:flex;align-items:center;padding:0 11px;background:var(--bg3);border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;font-weight:600;font-size:12px;color:var(--mu)}
.pre input{border-radius:0 8px 8px 0!important}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg2);color:var(--mu);font-weight:600;font-size:12px}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sw{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw .t{flex:1;font-size:13px;font-weight:600}
.sw .t small{display:block;color:var(--mu);font-size:11px;font-weight:400}
.tog{appearance:none;-webkit-appearance:none;width:36px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:background .2s;cursor:pointer}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tog:checked{background:var(--ac)} .tog:checked::after{transform:translateX(14px)}
.imgup{display:flex;gap:10px;align-items:center}
.imgup img{width:72px;height:72px;object-fit:cover;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.savebar{position:sticky;top:101px;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:10px 0;margin-top:-14px;background:var(--bg)}
.savebar h2{font-size:17px;font-weight:700}
.hint{font-size:11px;color:var(--mu);margin-top:5px}
.lnkbox{display:flex;gap:7px;margin:8px 0}
.lnkbox input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:monospace;font-size:11px;color:var(--ac)}
.qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:11px;width:max-content;margin:10px auto}
canvas.tal{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:10px}
/* hoja inferior (.overlay/.sheet) */
.mod{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:400;display:flex;align-items:flex-end;justify-content:center}
.mod .box{background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:up .2s ease}
.mod .box::before{content:'';display:block;width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mod h2{font-size:17px;font-weight:700;margin-bottom:10px}
.mod .x{position:absolute;right:14px;top:14px}
.mod .fld input:not([type=checkbox]),.mod .fld textarea,.mod .fld select,.mod .in{background:var(--bg3)}
.bigimg{width:100%;border-radius:9px;background:#000}
/* toast */
.toast{position:fixed;left:50%;bottom:65px;transform:translateX(-50%);opacity:0;background:var(--bg3);border:1px solid var(--ok);color:var(--tx);padding:9px 18px;border-radius:20px;font-size:12px;font-weight:500;z-index:999;transition:opacity .3s;max-width:92vw;text-align:center;pointer-events:none}
.toast.on{opacity:1}
.toast.bad{border-color:var(--bad)} .toast.ok{border-color:var(--ok)}
/* PIN (teclado de Total-Tools) */
.pinbox{width:100%;max-width:340px;margin:0 auto;padding:0 18px;text-align:center}
.pin-dots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:14px;margin:16px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);transition:background .15s}
.pin-dot.filled{background:var(--ac);border-color:var(--ac)}
.pin-dots.error .pin-dot{background:var(--bad);border-color:var(--bad)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-btn{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);font-size:20px;font-weight:700;transition:all .15s}
.pin-btn:active{background:var(--ac);border-color:var(--ac);color:#fff}
.pin-btn-del{background:var(--bg2);color:var(--mu)}
.pin-btn-ok{background:#2ea0431f;color:var(--ok);border-color:#2ea0434d}
/* en vivo */
.live{position:fixed;inset:0;z-index:500;background:radial-gradient(900px 600px at 50% 30%,#1c2333,#0d1117 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
.live .lt{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(18px,4vw,30px);color:#e6edf3}
.live .lp{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(22px,5vw,40px);color:var(--warn);margin:10px 0 6px}
.live .ln{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(90px,26vw,220px);line-height:1;color:#fff;text-shadow:0 0 40px #388bfdaa;margin:18px 0;font-variant-numeric:tabular-nums}
.live .ln.win{color:var(--ok);text-shadow:0 0 60px #2ea043cc;animation:pop .5s}
.live .lw{font-size:clamp(20px,4.5vw,34px);font-weight:700;min-height:1.4em}
.live .lf{position:absolute;bottom:20px;left:0;right:0;font-size:11px;color:var(--mu);padding:0 16px;word-break:break-all}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.conf{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:550;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.list-res{display:grid;gap:8px;margin:12px 0}
.res{display:flex;align-items:center;gap:10px;padding:11px;border-radius:10px;background:var(--bg3);border:1px solid var(--line)}
.res .n{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--ok);min-width:56px;text-align:center}
.res.sup .n{color:var(--mu)}
.spin{width:18px;height:18px;border:2.5px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loadfull{display:grid;place-items:center;min-height:70vh}
.loadfull .spin{width:34px;height:34px;border-color:#388bfd44;border-top-color:var(--ac)}
.powered{text-align:center;padding:18px;font-size:10px;color:var(--line);letter-spacing:1px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
</style>
</head>
<body>

<!-- ============ APP ============ -->
<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="logo">🎟️</div>
    <div class="sp" style="min-width:0">
      <div class="row" style="gap:6px"><h1 id="hNeg" style="min-width:0">SORTEOS</h1><span class="dot" id="hDot" title="Conexión"></span></div>
      <div class="sub"><span class="mu" id="hWa"></span><span class="pill p-pur" id="hEst">Panel</span></div>
    </div>
    <button class="ibtn bell" id="hBell" style="position:relative" aria-label="Avisos">🔔</button>
    <button class="ibtn out" id="hOut" title="Cerrar sesión">↪</button>
  </header>

  <div class="rbar" id="rbar"></div>

  <nav class="tabs">
    <button class="tab on" data-tab="sorteo">🎟️ Sorteo</button>
    <button class="tab" data-tab="compartir">🔗 Compartir</button>
    <button class="tab" data-tab="config">⚙️ Config</button>
  </nav>

  <!-- TAB SORTEO -->
  <section id="t-sorteo">
    <div class="stats" id="stats"></div>
    <div class="money" id="money"></div>
    <div class="card" style="padding:12px">
      <div class="search"><span>🔎</span><input id="q" placeholder="Buscar nombre, celular, N° op, número…"><button id="qx" class="mu" hidden>✕</button></div>
      <div class="chips" id="chips"></div>
      <div class="tools">
        <button class="ibtn" id="bRef" title="Actualizar">🔄</button>
        <button class="ibtn" id="bVista" title="Grilla / lista">▦</button>
        <button class="ibtn" id="bCsv" title="Exportar CSV">📊</button>
        <button class="ibtn" id="bRes" title="Resultado">🏆</button>
        <button class="ibtn gold" id="bSort" title="Sortear">🎲</button>
      </div>
    </div>
    <div id="lista"></div>
  </section>

  <!-- TAB COMPARTIR -->
  <section id="t-compartir" hidden></section>

  <!-- TAB CONFIG -->
  <section id="t-config" hidden></section>
</div>

<div id="boot" class="loadfull"><div class="spin"></div></div>
<div id="live" class="live" hidden></div>
<div id="toast" class="toast"></div>

<script>
/* =====================================================================
   CONFIG — edita aquí
   ===================================================================== */
const CONFIG = {
  API: 'https://sorteos.jarryllanoski.workers.dev', // URL de tu Worker, ej: https://sorteos.tuusuario.workers.dev
  PIN: '',              // Déjalo vacío: el panel lo pide en pantalla (el repo es público)
  FORM: '',             // URL pública de formulario.html (vacío = misma carpeta que este panel)
  NEGOCIO: 'TOTAL TOOLS',
  POLL_MS: 30000,       // cada cuánto revisa registros nuevos (campana)
};

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem('sxa_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('sxa_' + k, JSON.stringify(v)); } catch (e) {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtS = n => 'S/ ' + (+n || 0).toFixed(2);
const baseOf = c => (c.base === 0 ? 0 : 1);
const digs = c => String((c.cantidad || 1) - 1 + baseOf(c)).length;

function waURL(num, text) {
  let n = String(num || '').replace(/\D/g, '');

}

function precioTotal(c, k) {
  const pu = +c.precio || 0, promos = (c.promos || []).filter(p => p.n > 1), best = [0];
  for (let i = 1; i <= k; i++) { let v = best[i - 1] + pu; for (const p of promos) if (i >= p.n) v = Math.min(v, best[i - p.n] + p.p); best[i] = v; }
  return Math.round(best[k] * 100) / 100;
}
async function comprimir(file, max = 1280, q = 0.78) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let b = await new Promise(r => cv.toBlob(r, 'image/webp', q));
    if (!b || b.type !== 'image/webp') b = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    return b;
  } finally { URL.revokeObjectURL(url); }
}

  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

const API = {
  async req(path, opt = {}) {
    const h = { 'x-pin': S.pin, ...(opt.headers || {}) };
    let body = opt.body;
    if (body && !(body instanceof Blob) && !(body instanceof FormData)) { body = JSON.stringify(body); h['content-type'] = 'application/json'; }
    let r;
    try { r = await fetch(S.api.replace(/\/$/, '') + path, { method: opt.method || (body ? 'POST' : 'GET'), headers: h, body }); }
    catch (e) { setDot(false); throw new Error('Sin conexión con el servidor'); }
    let j; try { j = await r.json(); } catch (e) { throw new Error('Respuesta inválida (' + r.status + ')'); }
    setDot(true);
    if (!r.ok || j.ok === false) { const e = new Error(j.error || 'Error ' + r.status); e.status = r.status; throw e; }
    return j;
  },
  rifas: () => API.req('/api/admin/rifas'),
  guardar: (id, cfg) => API.req('/api/admin/rifas', { body: { id, cfg } }),
  borrar: id => API.req('/api/admin/rifas/' + id, { method: 'DELETE' }),
  detalle: id => API.req('/api/admin/r/' + id + '/part'),
  accion: (pid, acc, extra = {}) => API.req('/api/admin/part/' + pid, { body: { acc, ...extra } }),
  sortear: (id, g, s, force) => API.req('/api/admin/r/' + id + '/sortear', { body: { g, s, force } }),
  subir: blob => API.req('/api/admin/upload', { body: blob, headers: { 'content-type': blob.type } }),
  link: d => API.req('/api/admin/links', { body: d }),
  async img(key) {
    if (S.imgs.has(key)) return S.imgs.get(key);
    const r = await fetch(S.api.replace(/\/$/, '') + '/api/admin/img/' + key.split('/').map(encodeURIComponent).join('/'), { headers: { 'x-pin': S.pin } });
    if (!r.ok) throw new Error('No se pudo cargar la imagen');
    const u = URL.createObjectURL(await r.blob()); S.imgs.set(key, u); return u;
  },
};

// Teclado PIN (mismo diseño que Total-Tools); resuelve con el PIN escrito
function pedirPin(error) {
  return new Promise(res => {
    $('#boot').hidden = true;
    const d = document.createElement('div'); d.className = 'loadfull';
    const teclas = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="pin-btn" data-pin="${n}">${n}</button>`).join('');
    d.innerHTML = `<div class="pinbox"><div class="logo" style="margin:0 auto 12px">🎟️</div>
      <h2 style="font-size:17px;font-weight:700">🔐 Clave requerida</h2>
      <p class="mu" style="margin-top:6px">${error ? 'PIN incorrecto, intenta de nuevo' : 'Ingresa tu PIN del panel'}</p>
      <div class="pin-dots${error ? ' error' : ''}"></div>
      <div class="pin-grid">${teclas}<button class="pin-btn pin-btn-del" data-pin="del">⌫</button><button class="pin-btn" data-pin="0">0</button><button class="pin-btn pin-btn-ok" data-pin="ok">✓</button></div></div>`;
    document.body.appendChild(d);
    const dots = $('.pin-dots', d);
    let v = '';
    const pinta = () => { dots.classList.remove('error'); dots.innerHTML = v ? '<div class="pin-dot filled"></div>'.repeat(v.length) : '<div class="pin-dot"></div>'.repeat(4); };
    const tecla = k => {
      if (k === 'ok') { if (!v) return; d.remove(); document.removeEventListener('keydown', kb); $('#boot').hidden = false; return res(v); }
      if (k === 'del') v = v.slice(0, -1); else if (v.length < 12) v += k;
      pinta();
    };
    const kb = e => { if (/^\d$/.test(e.key)) tecla(e.key); else if (e.key === 'Backspace') tecla('del'); else if (e.key === 'Enter') tecla('ok'); };
    d.addEventListener('click', e => { const b = e.target.closest('[data-pin]'); if (b) tecla(b.dataset.pin); });
    document.addEventListener('keydown', kb);
    dots.innerHTML = '<div class="pin-dot"></div>'.repeat(4);
  });
}
async function iniciar(error) {
  // Sin PIN en CONFIG se pide en pantalla y se recuerda solo en este dispositivo
  if (!S.pin) S.pin = await pedirPin(error);
  try {
    await cargarRifas();
    if (!CONFIG.PIN) lsSet('pin', S.pin);
    $('#boot').hidden = true; $('#app').hidden = false;
    if (!S.rifas.find(r => r.id === S.rid)) S.rid = S.rifas[0]?.id || '';
    if (S.rid) await cargarDetalle(); else renderVacio();
    poll();
  } catch (e) {
    if (e.status === 401 && !CONFIG.PIN) { lsSet('pin', ''); S.pin = ''; return iniciar(true); }
    if (e.status === 401) vAviso('PIN incorrecto', 'El PIN de CONFIG en index.html no coincide con ADMIN_PIN del Worker.');
    else vAviso('No se pudo conectar', e.message);
  }
}

async function cargarRifas() {
  const j = await API.rifas(); S.rifas = j.rifas;
  const tot = j.rifas.reduce((a, r) => a + (r.act || 0), 0);
  if (S.act != null && tot > S.act) avisoNuevo(tot - S.act);
  S.act = tot; renderRBar();
}
async function cargarDetalle(silent) {
  if (!S.rid) return renderVacio();
  try { S.d = await API.detalle(S.rid); lsSet('rid', S.rid); renderTodo(); }
  catch (e) { if (e.status === 404) { S.rid = ''; lsSet('rid', ''); await cargarRifas(); S.rid = S.rifas[0]?.id || ''; return S.rid ? cargarDetalle() : renderVacio(); } if (!silent) toast(e.message, 'bad'); }
}
let pollT;
function poll() {
  clearTimeout(pollT);
  pollT = setTimeout(async () => {
    if (document.visibilityState === 'visible') {
      const prev = S.act;
      try { await cargarRifas(); if (S.act !== prev && S.rid) await cargarDetalle(true); } catch (e) {}
    }
    poll();
  }, CONFIG.POLL_MS);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('#app').hidden) cargarRifas().then(() => cargarDetalle(true)).catch(() => {}); });

function avisoNuevo(n) {

  b.innerHTML = `🔔<span class="badge-n">${S.nuevos}</span>`;
  toast(`🔔 ${n} movimiento(s) nuevo(s)`, 'ok');
  try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination); o.frequency.value = 880; g.gain.setValueAtTime(.15, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .4); o.start(); o.stop(ac.currentTime + .4);
  } catch (e) {}
}

  return S.d.parts.filter(p => {
    if (S.filtro !== 'todos' && p.est !== S.filtro) return false;
    if (!q) return true;
    const nums = splitN(p.nums).map(i => fmtN(c, i)).join(' ');
    return [p.nombre, p.cel, p.op, p.dni, p.id, nums].join(' ').toLowerCase().includes(q) || splitN(p.nums).some(i => String(i + baseOf(c)) === q.replace(/^0+/, ''));

async function enVivo(res, fs) {
  const c = cfg(), ov = $('#live'), pool = [];
  for (let i = 0; i < res.snap.length; i++) if (res.snap[i] === '1') pool.push(i);
  ov.hidden = false;
  if (fs) try { await ov.requestFullscreen?.(); } catch (e) {}
  for (let k = 0; k < res.picks.length; k++) {
    const pk = res.picks[k], sup = k >= res.g;
    const lbl = sup ? `Suplente ${k - res.g + 1}` : `${k + 1}° premio`;
    const prem = sup ? '' : ((c.premios || [])[k] || '');
    ov.innerHTML = `<div class="lt">${esc(c.titulo)}</div><div class="lp">${sup ? '🎗️' : '🏆'} ${esc(lbl)}${prem ? ' · ' + esc(prem) : ''}</div>
      <div class="ln" id="lvN">${fmtN(c, pool[0] || 0)}</div><div class="lw" id="lvW"></div>
      <button class="btn ac" id="lvB" style="margin-top:22px;visibility:hidden">${k < res.picks.length - 1 ? 'Siguiente ➜' : 'Ver resultado ✔'}</button>
      <div class="lf">🔐 Sorteo verificable · ${pool.length} números pagados · drand #${res.round || '—'}</div>`;
    await sleep(500);
    const el = $('#lvN'); let d = 45; const t0 = performance.now();
    while (performance.now() - t0 < 3200) { el.textContent = fmtN(c, pool[Math.floor(Math.random() * pool.length)]); await sleep(d); d = Math.min(d * 1.07, 260); }
    el.textContent = fmtN(c, pk.n); el.classList.add('win');
    $('#lvW').textContent = '🎉 ' + pk.nom;
    if (!sup) confeti();
    const b = $('#lvB'); b.style.visibility = 'visible';
    await new Promise(r => b.onclick = r);
  }
  ov.hidden = true; ov.innerHTML = '';
  if (document.fullscreenElement) try { await document.exitFullscreen(); } catch (e) {}
}
function confeti() {
  const cols = ['#2ea043', '#388bfd', '#d29922', '#a371f7', '#f78166', '#fff'];
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('div'); p.className = 'conf';

function talonarioPNG() {

  const rows = Math.ceil(n / cols), W = pad * 2 + cols * cell + (cols - 1) * gap, head = 210, H = head + rows * (cell + gap) + 120;

  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d1117'); g.addColorStop(1, '#0d1117'); x.fillStyle = g; x.fillRect(0, 0, W, H);

  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), cc = i % cols, X = pad + cc * (cell + gap), Y = head + r * (cell + gap), [bg, fg] = COL[b[i]];
    x.fillStyle = bg; rr(x, X, Y, cell, cell, 12); x.fill();
    if (b[i] === '0') { x.strokeStyle = '#388bfd88'; x.lineWidth = 2; x.stroke(); }
    x.fillStyle = fg; x.fillText(fmtN(c, i), X + cell / 2, Y + cell / 2 + 2);
    if (b[i] !== '0') { x.strokeStyle = fg; x.lineWidth = 3; x.beginPath(); x.moveTo(X + 14, Y + 14); x.lineTo(X + cell - 14, Y + cell - 14); x.stroke(); }
  }

  x.fillText('Números tachados ya fueron tomados · Elige el tuyo en el link 👇', W / 2, H - 70);

  <div class="card"><h3>💳 Datos de pago</h3>
    <div class="grid2">${F('precio', 'Precio por número S/', 'min="0" step="0.5" inputmode="decimal" data-t="num"', 'number')}<div></div></div>
    ${TA('promos', 'Promociones (cantidad=precio, una por línea)', '3=12\n5=18', 'promos')}
    <div class="grid2">${F('yape', 'Número Yape', 'inputmode="numeric" placeholder="9xxxxxxxx"')}${F('plin', 'Número Plin', 'inputmode="numeric" placeholder="opcional"')}</div>
    ${F('titular', 'Titular (como aparece en Yape)', 'placeholder="Ej: Herracast S.A.C."')}
    ${IMG('qr', 'QR de Yape / Plin')}
    ${TA('bancos', 'Cuentas bancarias', 'BCP Soles: 191-xxxxxxx-0-xx\nCCI: 002-191-xxxxxxxxxxxx-xx')}
    ${TA('instr', 'Instrucciones de pago', 'Envía el monto exacto y sube la captura con el N° de operación visible.')}
    ${SW('compObl', '📸 Comprobante obligatorio', 'Si lo apagas, el cliente puede reservar y pagar después')}
    ${SW('opObl', '🧾 Pedir N° de operación', 'Evita que reutilicen la misma captura')}
  </div>

  <div class="card"><h3>📲 Contacto</h3>
    ${F('negocio', 'Nombre del negocio', 'placeholder="TOTAL TOOLS"')}
    <label class="fld"><span>WhatsApp que recibe los registros</span><div class="pre"><b>+51</b><input data-k="wa" inputmode="numeric" placeholder="9xxxxxxxx"></div></label>
  </div>

  <div class="card"><h3>📜 Bases del sorteo</h3>
    ${TA('bases', 'Bases y términos', 'Organizador, premio, fecha, cómo se elige al ganador, plazo para reclamar, uso de datos…')}
    <button class="btn sm" id="basesTpl">✍️ Usar plantilla</button>
  </div>

  <div class="card"><h3>🛡️ Sistema</h3>
    ${F('tsKey', 'Turnstile Site Key (antispam, opcional)', 'placeholder="0x4AAAA…"')}
    <label class="fld"><span>URL de formulario.html</span><input id="sysForm" placeholder="${esc(new URL('formulario.html', location.href).href)}"></label>
    <p class="hint">🔐 Compromiso de semilla: <span style="word-break:break-all">${esc(cfg().seedHash || '')}</span></p>
    <div style="display:grid;gap:8px;margin-top:12px"><button class="btn bad full" id="cfgDel">🗑️ Eliminar este sorteo</button></div>
  </div>`;
  const c = cfg();
  $$('[data-k]', $('#t-config')).forEach(el => {
    const k = el.dataset.k, t = el.dataset.t, v = c[k];
    if (t === 'seg' || t === 'segn') $$('button', el).forEach(b => b.classList.toggle('on', String(b.dataset.v) === String(t === 'segn' ? baseOf(c) : v)));
    else if (t === 'bool') el.checked = k === 'elegir' || k === 'opObl' ? v !== false : !!v;
    else if (t === 'lines') el.value = (v || []).join('\n');
    else if (t === 'promos') el.value = (v || []).map(p => `${p.n}=${p.p}`).join('\n');
    else if (t === 'date') el.value = toLocalInput(v);
    else el.value = v ?? '';
  });
  $$('[data-prev]').forEach(im => { const k = c[im.dataset.prev]; im.src = k ? pubImg(k) : ''; im.style.visibility = k ? 'visible' : 'hidden'; });
  $('#sysForm').value = S.form || '';
}
function leerCfg() {
  const o = {};
  $$('[data-k]', $('#t-config')).forEach(el => {
    const k = el.dataset.k, t = el.dataset.t;
    if (t === 'seg') o[k] = $('button.on', el)?.dataset.v;
    else if (t === 'segn') o[k] = +($('button.on', el)?.dataset.v ?? 1);
    else if (t === 'bool') o[k] = el.checked;
    else if (t === 'num') o[k] = el.value === '' ? 0 : +el.value;
    else if (t === 'lines') o[k] = el.value.split('\n').map(s => s.trim()).filter(Boolean);
    else if (t === 'promos') o[k] = el.value.split('\n').map(s => s.split(/[=:x]/i).map(z => +z.replace(',', '.').replace(/[^\d.]/g, ''))).filter(a => a[0] > 1 && a[1] >= 0).map(a => ({ n: a[0], p: a[1] }));
    else if (t === 'date') o[k] = el.value ? new Date(el.value).getTime() : 0;
    else o[k] = el.value.trim();
  });
  o.wa = (o.wa || '').replace(/\D/g, ''); o.yape = (o.yape || '').replace(/\D/g, ''); o.plin = (o.plin || '').replace(/\D/g, '');
  return o;
}
async function guardarCfg() {
  const o = leerCfg(), b = $('#cfgSave');
  if (!o.titulo) return toast('Escribe un título', 'bad');
  if (o.modo === 'pago' && !o.yape && !o.plin && !o.bancos && !o.qr) toast('💡 Agrega al menos un dato de pago', 'bad');
  const f = $('#sysForm').value.trim(); S.form = f; lsSet('form', f);
  b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try { await API.guardar(S.rid, o); toast('✅ Guardado', 'ok'); await cargarRifas(); await cargarDetalle(); }
  catch (e) { toast(e.message, 'bad'); }
  finally { b.disabled = false; b.innerHTML = '💾 Guardar'; }
}
async function subirImg(k, file) {
  const im = $(`[data-prev="${k}"]`); im.style.visibility = 'visible'; im.style.opacity = .4;
  try { const bl = await comprimir(file, 1400, .82); const j = await API.subir(bl); $(`[data-k="${k}"]`).value = j.key; im.src = pubImg(j.key); toast('📷 Imagen lista. Toca Guardar.'); }
  catch (e) { toast(e.message, 'bad'); }
  finally { im.style.opacity = 1; }
}
function plantillaBases() {
  const c = leerCfg();
  return `BASES DEL SORTEO "${c.titulo}"\n\n1. ORGANIZADOR: ${c.negocio || CONFIG.NEGOCIO}.\n2. PREMIO(S): ${(c.premios || []).join('; ')}.\n3. PARTICIPACIÓN: ${c.modo === 'gratis' ? 'Gratuita, registrándose en el formulario.' : `Cada número cuesta S/ ${(+c.precio || 0).toFixed(2)}. Solo participan los números con pago verificado.`}\n4. FECHA: El sorteo se realizará el ${c.cierre ? new Date(c.cierre).toLocaleString('es-PE') : '[fecha]'} y se transmitirá en vivo.\n5. MECÁNICA: El ganador se elige con un sistema aleatorio verificable. La semilla se publica comprometida desde el inicio y el resultado puede comprobarse en la página de participantes.\n6. SUPLENTES: Si el ganador no responde en 72 horas, el premio pasa al suplente.\n7. ENTREGA: Coordinada con el ganador presentando su DNI.\n8. DATOS PERSONALES: Los datos se usan solo para este sorteo (Ley 29733). En la lista pública el nombre y el celular aparecen parcialmente ocultos.\n9. Al participar aceptas estas bases.`;
}
async function eliminarRifa() {
  if (!confirm('¿Eliminar este sorteo con TODOS sus participantes y comprobantes? No se puede deshacer.')) return;
  if (prompt('Escribe ELIMINAR para confirmar') !== 'ELIMINAR') return;
  try { await API.borrar(S.rid); toast('🗑️ Eliminado'); S.rid = ''; lsSet('rid', ''); await cargarRifas(); S.rid = S.rifas[0]?.id || ''; S.rid ? await cargarDetalle() : renderVacio(); irTab('sorteo'); }
  catch (e) { toast(e.message, 'bad'); }
}
function nuevaRifa() {
  const m = modal(`<h2>＋ Nuevo sorteo</h2>
    ${F('titulo', 'Título', 'id="nT" placeholder="Ej: Sorteo Amoladora TOTAL"')}
    <div class="fld"><span>Tipo</span><div class="seg" id="nM"><button data-v="pago" class="on">💰 Rifa pagada</button><button data-v="gratis">🎁 Sorteo gratis</button></div></div>
    <div class="grid2"><label class="fld"><span>Cantidad de números</span><input id="nC" type="number" value="100" min="1" max="10000" inputmode="numeric"></label><label class="fld"><span>Precio S/</span><input id="nP" type="number" value="5" min="0" step="0.5" inputmode="decimal"></label></div>
    <button class="btn ac full" id="nGo" style="margin-top:8px">Crear sorteo</button>`);
  $('#nM', m).onclick = e => { const b = e.target.closest('button'); if (!b) return; $$('#nM button', m).forEach(x => x.classList.toggle('on', x === b)); $('#nP', m).closest('.fld').hidden = b.dataset.v === 'gratis'; };
  $('#nGo', m).onclick = async () => {
    const t = $('#nT', m).value.trim(); if (!t) return toast('Escribe un título', 'bad');
    const modo = $('#nM button.on', m).dataset.v, prev = cfg();
    const base = { titulo: t, modo, cantidad: +$('#nC', m).value || 100, precio: +$('#nP', m).value || 0, maxPer: modo === 'gratis' ? 1 : 0, maxSel: modo === 'gratis' ? 1 : 20 };
    for (const k of ['negocio', 'wa', 'yape', 'plin', 'titular', 'qr', 'bancos', 'instr', 'tsKey']) if (prev[k]) base[k] = prev[k];
    $('#nGo', m).disabled = true;
    try { const j = await API.guardar(null, base); m.close(); S.rid = j.id; await cargarRifas(); await cargarDetalle(); irTab('config'); toast('🎉 Sorteo creado. Completa los datos y guarda.', 'ok'); }
    catch (e) { toast(e.message, 'bad'); $('#nGo', m).disabled = false; }
  };
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
function irTab(t) {
  S.tab = t;
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['sorteo', 'compartir', 'config'].forEach(k => $('#t-' + k).hidden = k !== t);
  if (t === 'compartir') renderCompartir();
  if (t === 'config') renderConfig();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('click', async e => {
  const t = e.target;
  const tab = t.closest('.tab'); if (tab) return irTab(tab.dataset.tab);
  const rc = t.closest('[data-rid]'); if (rc) { S.rid = rc.dataset.rid; S.filtro = 'todos'; S.q = ''; $('#q').value = ''; renderRBar(); return cargarDetalle(); }
  if (t.closest('#bNueva')) return nuevaRifa();
  const f = t.closest('[data-f]'); if (f) { S.filtro = f.dataset.f; renderChips(); return renderLista(); }
  const a = t.closest('[data-a]'); if (a) return accion(a.closest('[data-pid]').dataset.pid, a.dataset.a);
  const im = t.closest('img[data-img]'); if (im && im.src) return modal(`<h2>🧾 Comprobante</h2><img class="bigimg" src="${im.src}"><a class="btn full" style="margin-top:10px" href="${im.src}" download="comprobante.webp">💾 Descargar</a>`);
  const nb = t.closest('.nb[data-n]');
  if (nb) { const i = +nb.dataset.n, p = dueño(i), c = cfg(); if (!p) return toast(`Número ${fmtN(c, i)} disponible`); S.vista = 'lista'; S.filtro = 'todos'; S.q = p.cel; $('#q').value = p.cel; $('#qx').hidden = false; renderChips(); return renderLista(); }
  const cp = t.closest('[data-c]'); if (cp) return copiar(cp.dataset.c);
  const op = t.closest('[data-o]'); if (op) return abrir(op.dataset.o);
  const sg = t.closest('.seg[data-k] button'); if (sg) { $$('button', sg.parentElement).forEach(b => b.classList.toggle('on', b === sg)); return; }
  const rm = t.closest('[data-rm]'); if (rm) { const k = rm.dataset.rm; $(`[data-k="${k}"]`).value = ''; const p = $(`[data-prev="${k}"]`); p.src = ''; p.style.visibility = 'hidden'; return; }
  switch (t.closest('button')?.id) {
    case 'hOut': if (!confirm('¿Cerrar sesión en este dispositivo?')) return; lsSet('pin', ''); return location.reload();
    case 'hBell': S.nuevos = 0; $('#hBell').innerHTML = '🔔'; irTab('sorteo'); S.filtro = 'V'; renderChips(); renderLista(); return cargarDetalle();
    case 'bRef': toast('🔄 Actualizando…'); await cargarRifas().catch(() => {}); return cargarDetalle();
    case 'bVista': S.vista = S.vista === 'lista' ? 'grilla' : 'lista'; return renderLista();
    case 'bCsv': return exportarCSV();
    case 'bSort': return abrirSorteo();
    case 'bRes': return verResultado();
    case 'cWa': return abrir(waURL('', msgDifusion(cfg(), stats())));
    case 'cWaP': return abrir(waURL('', `👥 Mira la lista de participantes y el talonario de *${cfg().titulo}*:\n${linkPart(S.rid)}`));
    case 'cQr': return mostrarQR();
    case 'lkCp': return crearLinkPers(false);
    case 'lkWa': return crearLinkPers(true);
    case 'cTal': return talonarioPNG();
    case 'difC': return copiar($('#dif').value);
    case 'difW': return abrir(waURL('', $('#dif').value));
    case 'cfgSave': return guardarCfg();
    case 'cfgDel': return eliminarRifa();
    case 'basesTpl': { const ta = $('[data-k="bases"]'); if (ta.value && !confirm('¿Reemplazar las bases actuales?')) return; ta.value = plantillaBases(); return; }
    case 'qx': S.q = ''; $('#q').value = ''; $('#qx').hidden = true; return renderLista();
  }
});
document.addEventListener('change', e => { const u = e.target.closest('[data-up]'); if (u && u.files[0]) subirImg(u.dataset.up, u.files[0]); });
let qT;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value; $('#qx').hidden = !S.q; if (S.vista === 'grilla') S.vista = 'lista'; renderLista(); }, 180); });

/* ===================================================================== */
if (!S.api) vAviso('Falta configurar', 'Abre index.html y pon la URL de tu Worker en CONFIG.API y tu PIN en CONFIG.PIN.');
else iniciar();
</script>
</body>
</html>
